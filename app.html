let openFormType=null, formSubtype='receita';
// Abre o formulário em tela cheia.
function openForm(type){
  // Quando o formulário vem do menu +, a entrada de histórico dele é
  // reaproveitada — assim um toque no voltar não precisa desfazer dois passos.
  const veioDoMenu=fabHistoryEntry;
  hideFab(); fabHistoryEntry=false;
  if(!veioDoMenu) pushHistoryEntry();
  openFormType=type;
  const cfg={
    receita:{title:'Nova Entrada',theme:'green',color:'#16a34a'},
    despesa:{title:'Nova Despesa',theme:'red',color:'#dc2626'},
    transferencia:{title:'Transferência',theme:'blue',color:'#2563eb'},
    investimento:{title:'Investimento',theme:'gold',color:'#7c3aed'},
    meta:{title:'Nova Meta',theme:'gold',color:'#ca8a04'},
  }[type];
  const mount=document.getElementById('formMount');
  pendingItems=[];
  if(type==='meta') mount.innerHTML=goalForm(cfg);
  else if(type==='receita'||type==='despesa') mount.innerHTML=multiEntryFormHtml(type,cfg);
  else mount.innerHTML=singleEntryFormHtml(type,cfg);
  requestAnimationFrame(()=>document.querySelector('.form-screen').classList.add('show'));
  if(type==='receita'||type==='despesa'){ setupEntryFields(type); updateFormTotal(type); renderSavedEntries(type); }
  const amt=document.getElementById('fAmount'); if(amt) setTimeout(()=>amt.focus(),300);
}
// Fecha o formulário e redesenha a tela que estava atrás.
function closeForm(){
  if(!nativeBackButton && historyDepth>0 && document.querySelector('.form-screen')){ history.back(); return; }
  applyCloseForm();
}

// Fecha o formulário de fato (chamada pelo popstate).
function applyCloseForm(){
  const fs=document.querySelector('.form-screen'); if(!fs) return;
  fs.classList.remove('show');
  setTimeout(()=>{ document.getElementById('formMount').innerHTML=''; renderAll(); },300);
}
// Opções do seletor de carteira.
function walletOptions(sel){ return state.wallets.map(w=>`<option value="${w.id}" ${sel===w.id?'selected':''}>${w.emoji} ${w.name} — ${money(w.balance)}</option>`).join(''); }
// Opções de categoria de entrada.
function incomeCategoryOptions(){ return Object.keys(INCOME_CATEGORIES).map(k=>`<option value="${k}">${INCOME_CATEGORIES[k].e} ${k}</option>`).join(''); }
// Opções de categoria de despesa.
function expenseCategoryOptions(){ return Object.keys(EXPENSE_CATEGORIES).map(k=>`<option value="${k}">${EXPENSE_CATEGORIES[k].e} ${k}</option>`).join(''); }

/* ============================================================
   Formulário de várias entradas

   Observação:
   A ideia aqui é lançar várias coisas de uma vez sem sair da tela.
   O usuário preenche um bloco, toca em "Inserir" e o item vai para
   uma lista temporária; só ao salvar é que tudo vira transação.
   Fiz assim porque, na prática, quem lança gasto costuma lançar
   três ou quatro de uma vez — abrir e fechar o formulário a cada
   item deixava o uso cansativo. */
let pendingItems=[];
// Formulário que aceita vários lançamentos seguidos.
function multiEntryFormHtml(type,cfg){
  const today=new Date().toISOString().slice(0,10);
  const isDesp=type==='despesa';
  const totalLabel=isDesp?'Total das despesas — soma automática':'Total das entradas — soma automática';
  const addLabel=isDesp?'＋ Inserir despesa':'＋ Inserir entrada';
  const saveLabel=isDesp?'Salvar Despesa':'Salvar Entrada';
  return `<div class="form-screen">
    <div class="hdr-simple ${cfg.theme}">
      <button class="hdr-icn" onclick="closeForm()">‹</button>
      <h1>${cfg.title}</h1>
      <button class="hdr-icn" onclick="closeForm()">✕</button></div>
    <div class="form-body">
      <div class="amount-display ${cfg.theme}">
        <span class="cur">R$</span> <span id="formTotal" class="tot num">0,00</span>
      </div>
      <div class="form-total-sub">${totalLabel}</div>

      <div class="entry-row" id="entryBlock">${entryFieldsHtml(type)}</div>

      <div class="field" style="margin-top:16px"><label>Data</label>
        <div class="inp"><input id="fDate" type="date" value="${today}"></div></div>
      <div class="field"><label>Observação (opcional)</label>
        <div class="inp"><textarea id="fNote" placeholder="Adicione uma observação..."></textarea></div></div>

      <button type="button" class="add-row-btn ${cfg.theme}" onclick="addPendingItem('${type}')">${addLabel}</button>

      <div id="itemsList"></div>

      <button class="save-btn ${cfg.theme}" onclick="savePendingEntries('${type}')">${saveLabel}</button>

      <div id="savedList"></div>
    </div></div>`;
}
/* conteúdo interno do bloco de UM item (reaproveitado ao resetar) */
// Bloco de campos de um lançamento.
function entryFieldsHtml(type){
  const isDesp=type==='despesa';
  const valLabel=isDesp?'R$ da despesa':'Valor R$';
  const catOpts=isDesp?expenseCategoryOptions():incomeCategoryOptions();
  return `<div class="entry-head"><span class="entry-n">Novo item</span></div>
    <div class="field"><label>Categoria</label>
      <div class="inp"><select data-role="cat" onchange="onCategoryChange(this,'${type}')">${catOpts}</select></div></div>
    <div class="field"><label>${valLabel}</label>
      <div class="inp"><span>R$</span><input data-role="val" inputmode="decimal" placeholder="0,00" oninput="formatMoneyInput(this);updateFormTotal('${type}')"></div></div>
    <div data-role="extra"></div>`;
}
// Prepara os campos extras logo que o formulário abre.
function setupEntryFields(type){
  const blk=document.getElementById('entryBlock'); if(!blk) return;
  const sel=blk.querySelector('[data-role=cat]'); if(sel) onCategoryChange(sel,type);
}
// Limpa os campos para o próximo lançamento.
function clearEntryFields(type){
  const blk=document.getElementById('entryBlock'); if(!blk) return;
  blk.innerHTML=entryFieldsHtml(type);
  setupEntryFields(type);
}
/* Mostra "Descontar de" / "Nome" conforme a categoria (despesa) e
   "De onde veio" quando a entrada é um extra.

   Observação:
   Tanto "R$ Extras" quanto "Outros" são categorias guarda-chuva: o nome
   delas não diz nada sobre o lançamento. Sem esse campo, meses depois a
   lista vira uma fileira de "R$ Extras" iguais e não dá para saber qual
   foi a venda de canecas e qual foi o freela. */
// Mostra os campos extras que a categoria escolhida exige.
function onCategoryChange(sel,type){
  const blk=sel.closest('.entry-row'); const extra=blk.querySelector('[data-role=extra]'); const cat=sel.value;
  if(type==='receita'){
    if(cat==='R$ Extras'){
      extra.innerHTML=`<div class="field"><label>De onde veio esse extra</label>
        <div class="inp"><input data-role="custom" placeholder="Ex: Venda de canecas, freela, venda do vale..."></div></div>`;
    } else { extra.innerHTML=''; }
    return;
  }
  if(type!=='despesa') return;
  /* Toda despesa pergunta de onde sai o dinheiro. As categorias que
     costumam ser pagas com vale mostram também as duas carteiras de
     benefício; as outras ficam só com salário e poupança. */
  const aceitaVale=EXPENSES_WITH_SOURCE.includes(cat);
  const fontes=aceitaVale?PAYMENT_SOURCES:PAYMENT_SOURCES.filter(o=>!BENEFIT_WALLETS.includes(o.wallet));
  const opts=fontes.map(o=>`<option value="${o.key}">${o.label}</option>`).join('');
  const campoNome = cat==='Outros'
    ? `<div class="field"><label>Nome da despesa (aparece no gráfico)</label>
        <div class="inp"><input data-role="custom" placeholder="Ex: Presente, Pet, Doação..."></div></div>`
    : '';
  extra.innerHTML=campoNome+`<div class="field"><label>De onde vai sair esse dinheiro</label>
      <div class="inp"><select data-role="src" onchange="onSourceChange(this)">${opts}</select></div></div>
      <div data-role="hint"></div>`;
  const src=extra.querySelector('[data-role=src]');
  if(cat==='Mercado') src.value='valim';
  else if(cat==='Transporte') src.value='vtransp';
  onSourceChange(src);
}
// Mostra o saldo disponível da origem escolhida.
function onSourceChange(sel){
  const extra=sel.closest('[data-role=extra]'); const hint=extra.querySelector('[data-role=hint]'); if(!hint) return;
  const opt=paymentSource(sel.value); const benefit=BENEFIT_WALLETS.includes(opt.wallet);
  if(opt.wallet===SAVINGS_WALLET){
    hint.innerHTML=`<div class="suggest" style="background:rgba(13,148,136,.14);color:#0d9488">🐷 Sai da poupança — <b style="margin:0 3px">não</b> entra nas despesas do mês nem no gráfico. Guardado hoje: ${money(savingsBalance())}</div>`;
    return;
  }
  hint.innerHTML = benefit
    ? `<div class="suggest">✅ Pago com vale — <b style="margin:0 3px">não</b> desconta do seu saldo total.</div>`
    : `<div class="suggest" style="background:var(--blue-soft);color:var(--blue)">💠 Desconta do seu saldo (conta).</div>`;
}
/* lê o item que está sendo montado no bloco */
// Lê os campos preenchidos e devolve um item.
function readEntryFields(type){
  const blk=document.getElementById('entryBlock'); if(!blk) return null;
  const catSel=blk.querySelector('[data-role=cat]'); if(!catSel) return null;
  const cat=catSel.value;
  const valEl=blk.querySelector('[data-role=val]');
  const val=parseAmount(valEl?valEl.value:'');
  let src=null, name=cat, wallet, origin=null;
  if(type==='receita'){ wallet=INCOME_TARGET_WALLET[cat]||'banco';
    if(cat==='R$ Extras'){ const c=blk.querySelector('[data-role=custom]'); if(c&&c.value.trim()) origin=c.value.trim(); }
  }
  else {
    const s=blk.querySelector('[data-role=src]'); src=s?s.value:'sal';
    wallet=paymentSource(src).wallet;
    if(cat==='Outros'){ const c=blk.querySelector('[data-role=custom]'); if(c&&c.value.trim()) name=c.value.trim(); }
  }
  const noteEl=document.getElementById('fNote'); const note=noteEl&&noteEl.value.trim()?noteEl.value.trim():null;
  return {cat,val,src,name,wallet,note,origin};
}

/* Nome que aparece na lista.

   Observação:
   Só a categoria não basta em dois casos: entrada de "R$ Extras" e
   despesa de "Outros". Nesses dois o que foi escrito à mão vai junto,
   grudado no nome da categoria, para a linha fazer sentido meses depois. */
function entryDisplayName(type,it){
  if(type==='receita') return it.origin ? `${it.cat} — ${it.origin}` : it.cat;
  if(it.cat==='Outros' && it.name && it.name!=='Outros') return `Outros — ${it.name}`;
  return it.name;
}
/* adiciona o item à lista abaixo e limpa o bloco pro próximo */
// Põe o lançamento atual na lista temporária.
function addPendingItem(type){
  const e=readEntryFields(type); if(!e) return;
  if(!(e.val>0)){ showToast('Informe o valor do item'); return; }
  if(type==='despesa' && e.cat==='Outros' && (!e.name || e.name==='Outros')){ showToast('Dê um nome à despesa "Outros"'); return; }
  pendingItems.push(e);
  renderPendingItems(type);
  clearEntryFields(type);
  const noteEl=document.getElementById('fNote'); if(noteEl) noteEl.value='';
  updateFormTotal(type);
}
/* lista acumulada — valor editável + remover */
// Mostra a lista temporária, ainda não salva.
function renderPendingItems(type){
  const box=document.getElementById('itemsList'); if(!box) return;
  if(!pendingItems.length){ box.innerHTML=''; return; }
  const head=`<div class="items-head">Itens adicionados (${pendingItems.length})</div>`;
  box.innerHTML=head+pendingItems.map((it,i)=>{
    const info=categoryInfo(type,it.cat);
    const emoji=(type==='despesa'&&it.cat==='Outros')?'📦':info.e;
    const srcTxt=it.src?('· '+paymentSource(it.src).label.replace(/^\S+\s/,'')):'';
    const sub=it.note?('📝 '+it.note):srcTxt;
    const v=it.val.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    return `<div class="litem">
      <div class="li-ic" style="background:${hexToRgba(info.c,.14)};color:${info.c}">${emoji}</div>
      <div class="li-main"><div class="li-name">${entryDisplayName(type,it)}</div>${sub?`<div class="li-sub">${sub}</div>`:''}</div>
      <div class="li-val"><span>R$</span><input inputmode="decimal" value="${v}" oninput="formatMoneyInput(this);updatePendingValue(${i},this,'${type}')"></div>
      <button type="button" class="li-del" title="Remover" onclick="removePendingItem(${i},'${type}')">🗑</button>
    </div>`;
  }).join('');
}
// Edita o valor de um item da lista temporária.
function updatePendingValue(i,el,type){ if(pendingItems[i]) pendingItems[i].val=parseAmount(el.value); updateFormTotal(type); }
// Tira um item da lista temporária.
function removePendingItem(i,type){ pendingItems.splice(i,1); renderPendingItems(type); updateFormTotal(type); }
/* total = soma da lista + item que está sendo montado */
// Atualiza o total mostrado no rodapé do formulário.
function updateFormTotal(type){
  let sum=pendingItems.reduce((s,it)=>s+(it.val||0),0);
  const cur=readEntryFields(type); if(cur) sum+=cur.val||0;
  const el=document.getElementById('formTotal');
  if(el) el.textContent=sum.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
/* Salva os lançamentos e atualiza os saldos.

   Observação:
   O formulário continua aberto depois de salvar, mostrando embaixo o
   que já foi lançado no mês. Assim dá para conferir na hora e
   corrigir um valor digitado errado sem ter que procurar a transação
   depois na lista. */
function savePendingEntries(type){
  const cur=readEntryFields(type);
  if(cur && cur.val>0){
    if(type==='despesa' && cur.cat==='Outros' && (!cur.name || cur.name==='Outros')){ showToast('Dê um nome à despesa "Outros"'); return; }
    pendingItems.push(cur);
  }
  if(!pendingItems.length){ showToast('Adicione ao menos um item'); return; }
  /* Não dá para gastar da poupança mais do que está guardado nela. */
  const daPoupanca=pendingItems.filter(it=>it.wallet===SAVINGS_WALLET).reduce((sum,it)=>sum+it.val,0);
  if(daPoupanca>savingsBalance()){ showToast('A poupança tem '+money(savingsBalance())); return; }
  const date=(document.getElementById('fDate').value)||new Date().toISOString().slice(0,10);
  const n=pendingItems.length;
  pendingItems.forEach(it=>{
    const w=findWallet(it.wallet);
    if(type==='receita'){
      if(w) w.balance+=it.val;
      const tx={id:newId(),type:'receita',cat:it.cat,desc:entryDisplayName('receita',it),amount:it.val,date,wallet:it.wallet};
      if(it.origin) tx.origin=it.origin;
      if(it.note) tx.note=it.note; state.transactions.push(tx);
    } else {
      if(it.wallet===SAVINGS_WALLET) state.savings.balance-=it.val;   // sai do dinheiro guardado
      else if(w) w.balance-=it.val;
      const tx={id:newId(),type:'despesa',cat:it.name,desc:entryDisplayName('despesa',it),amount:it.val,date,wallet:it.wallet};
      if(it.note) tx.note=it.note; if(it.src) tx.src=it.src; state.transactions.push(tx);
    }
  });
  pendingItems=[];
  saveState();
  // não fecha: limpa o item + observação, atualiza listas e mostra os salvos abaixo
  renderPendingItems(type); clearEntryFields(type);
  const noteEl=document.getElementById('fNote'); if(noteEl) noteEl.value='';
  updateFormTotal(type); renderSavedEntries(type);
  const savedBox=document.getElementById('savedList'); if(savedBox&&savedBox.scrollIntoView){ try{savedBox.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){} }
  showToast(type==='receita'?`${n} entrada(s) salva(s) ✅`:`${n} despesa(s) salva(s) 💸`);
}
/* despesas/entradas JÁ salvas deste mês — com editar e excluir */
// Lista o que já foi salvo neste mês, para conferir e corrigir.
function renderSavedEntries(type){
  const box=document.getElementById('savedList'); if(!box) return;
  const mk=currentMonth();
  const list=state.transactions.filter(x=>x.type===type && toMonthKey(x.date)===mk)
    .sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length){ box.innerHTML=''; return; }
  const mes=MONTH_NAMES[new Date().getMonth()];
  const titulo=type==='receita'?`Entradas salvas · ${mes}`:`Despesas salvas · ${mes}`;
  box.innerHTML=`<div class="saved-head">${titulo} (${list.length})</div>`+list.map(x=>{
    const info=categoryInfo(type,x.cat);
    const srcTxt=x.src?paymentSource(x.src).label.replace(/^\S+\s/,''):'';
    const sub=x.note?('📝 '+x.note):srcTxt;
    return `<div class="litem">
      <div class="li-ic" style="background:${hexToRgba(info.c,.14)};color:${info.c}">${info.e}</div>
      <div class="li-main"><div class="li-name">${x.desc||x.cat}</div>${sub?`<div class="li-sub">${sub}</div>`:''}</div>
      <div class="li-fixed num">${money(x.amount)}</div>
      <button type="button" class="li-edit" title="Editar" onclick="editSavedEntry('${x.id}','${type}')">✏️</button>
      <button type="button" class="li-del" title="Excluir" onclick="deleteSavedEntry('${x.id}','${type}')">🗑</button>
    </div>`;
  }).join('');
}
// Procura uma transação pelo identificador.
function findTransaction(id){ return state.transactions.find(x=>x.id===id); }
// Apaga um lançamento já salvo e devolve o valor à carteira.
function deleteSavedEntry(id,type){
  const x=findTransaction(id); if(!x) return;
  if(!confirm(`Excluir "${x.desc||x.cat}" de ${money(x.amount)}?`)) return;
  undoWalletEffect(x);
  state.transactions=state.transactions.filter(t2=>t2.id!==id);
  saveState(); renderSavedEntries(type); updateFormTotal(type);
  showToast('Excluído 🗑');
}
/* editar = devolve o valor à carteira, remove o salvo e recoloca no bloco pra ajustar */
// Traz um lançamento salvo de volta para o formulário.
function editSavedEntry(id,type){
  const x=findTransaction(id); if(!x) return;
  undoWalletEffect(x);
  state.transactions=state.transactions.filter(t2=>t2.id!==id);
  saveState();
  // recoloca no bloco de edição
  const blk=document.getElementById('entryBlock'); if(blk){
    const catSel=blk.querySelector('[data-role=cat]');
    if(type==='despesa'){
      const known=Object.keys(EXPENSE_CATEGORIES).includes(x.cat);
      const cat = known ? x.cat : 'Outros';
      catSel.value=cat; onCategoryChange(catSel,type);
      if(cat==='Outros'){ const c=blk.querySelector('[data-role=custom]'); if(c) c.value=x.cat; }
      if(x.src){ const s=blk.querySelector('[data-role=src]');
        if(s && Array.prototype.some.call(s.options,o=>o.value===x.src)){ s.value=x.src; onSourceChange(s); } }
    } else {
      catSel.value=Object.keys(INCOME_CATEGORIES).includes(x.cat)?x.cat:'Salário';
      onCategoryChange(catSel,type);
      if(catSel.value==='R$ Extras' && x.origin){ const c=blk.querySelector('[data-role=custom]'); if(c) c.value=x.origin; }
    }
    const valEl=blk.querySelector('[data-role=val]');
    if(valEl){ valEl.value=x.amount.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  }
  renderSavedEntries(type); updateFormTotal(type);
  showToast('Ajuste e toque em Salvar novamente ✏️');
  const blk2=document.getElementById('entryBlock'); if(blk2&&blk2.scrollIntoView){ try{blk2.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){} }
}

// Salva uma transferência entre carteiras.
function saveSingleEntry(type){
  const amount=parseAmount(document.getElementById('fAmount').value);
  if(!(amount>0)){ showToast('Informe um valor válido'); return; }
  const desc=(document.getElementById('fDesc').value||'').trim();
  const date=(document.getElementById('fDate').value)||new Date().toISOString().slice(0,10);
  const wallet=document.getElementById('fWallet').value;
  const w=findWallet(wallet);
  const noteEl=document.getElementById('fNote'); const note=noteEl&&noteEl.value.trim()?noteEl.value.trim():null;
  const tx={id:newId(),type,amount,date,wallet};
  if(note) tx.note=note;
  if(type==='transferencia'){
    const to=document.getElementById('fWalletTo').value;
    if(to===wallet){ showToast('Escolha carteiras diferentes'); return; }
    if(w.balance<amount && !confirm(`Saldo insuficiente em ${w.name}. Transferir mesmo assim?`)) return;
    const tw=findWallet(to); w.balance-=amount; tw.balance+=amount;
    tx.toWallet=to; tx.desc=desc||`${w.name} → ${tw.name}`;
  } else {
    if(w.balance<amount && !confirm(`Saldo insuficiente em ${w.name}. Investir mesmo assim?`)) return;
    w.balance-=amount; const iw=findWallet('inv'); if(iw && wallet!=='inv') iw.balance+=amount;
    tx.toWallet='inv'; tx.cat='Investimentos'; tx.desc=desc||'Aporte';
  }
  state.transactions.push(tx); saveState(); closeForm(); renderAll();
  showToast(type==='transferencia'?'Transferência feita 🔄':'Investimento registrado 📈');
}

/* ============================================================
   Utilitários de valor / cor
   ============================================================ */
// Converte o texto digitado em número.
function parseAmount(v){ if(v==null) return 0;
  v=String(v).replace(/[^\d.,-]/g,'');
  if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.');
  const n=parseFloat(v); return isNaN(n)?0:n; }
/* Formata o valor enquanto a pessoa digita.

   Observação:
   A formatação é feita a cada tecla, sempre da direita para a
   esquerda (os dois últimos dígitos são os centavos). É o
   comportamento dos aplicativos de banco e evita que a pessoa
   precise se preocupar com vírgula e ponto. */
function formatMoneyInput(input){
  let d=input.value.replace(/\D/g,''); if(!d){ input.value=''; return; }
  d=(parseInt(d,10)/100).toFixed(2);
  input.value=d.replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}
// Converte uma cor hexadecimal em rgba, para usar transparência.
function hexToRgba(hex,a){ const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`; }
// Clareia ou escurece uma cor.
function shade(hex,pct){ const h=hex.replace('#','');
  let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  r=Math.max(0,Math.min(255,r+pct)); g=Math.max(0,Math.min(255,g+pct)); b=Math.max(0,Math.min(255,b+pct));
  return `rgb(${r},${g},${b})`; }

/* Volta para a tela anterior.

   Observação:
   O botão "Voltar" do app não navega direto: ele devolve uma entrada
   ao histórico do navegador e deixa o popstate fazer o trabalho.
   Parece um rodeio, mas é o que mantém o histórico do aparelho e a
   pilha de telas do app sempre com o mesmo tamanho. Se cada um
   andasse por conta própria, o botão do celular passaria a fechar o
   app no meio da navegação. */
function goBack(){
  if(!nativeBackButton && historyDepth>0){ history.back(); return; }
  applyGoBack();
}

function applyGoBack(){ const prev=screenHistory.pop()||'inicio'; showScreen(prev,true); }

}

/* ============================================================
   Janelinha da poupança

   Observação:
   Ficou como janela e não como tela inteira de propósito: incluir ou
   retirar um valor é coisa de dois toques, e sair da tela inicial só
   para isso quebrava o ritmo. O saldo continua à vista atrás dela.
   ============================================================ */
let savingsHistoryEntry=false;

// Abre a janelinha da poupança.
function openSavingsModal(){
  document.getElementById('savingsBack').classList.add('show');
  document.getElementById('savingsWin').classList.add('show');
  const add=document.getElementById('savingsAdd'), rem=document.getElementById('savingsRemove');
  if(add) add.value=''; if(rem) rem.value='';
  renderSavingsModal();
  pushHistoryEntry(); savingsHistoryEntry=true;
  setTimeout(()=>{ if(add) add.focus(); },260);
}
// Só esconde a janelinha, sem mexer no histórico.
function hideSavingsModal(){
  document.getElementById('savingsBack').classList.remove('show');
  document.getElementById('savingsWin').classList.remove('show');
}
// Fecha a pedido de quem usa (botão ✕ ou toque fora).
function closeSavingsModal(){
  hideSavingsModal();
  if(savingsHistoryEntry){ savingsHistoryEntry=false; if(!nativeBackButton && historyDepth>0) history.back(); }
}
// Atualiza o saldo e a lista dentro da janelinha.
function renderSavingsModal(){
  const v=document.getElementById('savingsBalanceView');
  if(v) v.textContent=money(savingsBalance());
  const box=document.getElementById('savingsMoves'); if(!box) return;
  /* A lista junta o que foi incluído e retirado à mão com as despesas
     que foram pagas com a poupança — as três coisas mexem no valor
     guardado, então precisam aparecer no mesmo lugar. */
  const manuais=(state.savings.history||[]).map(m=>({
    id:m.id, date:m.date, out:(m.kind==='saida'), amount:m.amount,
    label:(m.kind==='saida'?'Retirado':m.kind==='transf'?'Enviado do saldo':'Incluído'), removable:true }));
  const despesas=state.transactions
    .filter(x=>x.type==='despesa' && x.wallet===SAVINGS_WALLET)
    .map(x=>({ id:x.id, date:x.date, out:true, amount:x.amount,
      label:'Despesa · '+(x.desc||x.cat), removable:false }));
  const list=manuais.concat(despesas).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  if(!list.length){ box.innerHTML=''; return; }
  box.innerHTML='<div class="mw-lbl">Últimos movimentos</div>'+list.map(m=>`<div class="mw-mov">
      <span class="mv-d">${formatDayMonth(m.date)}</span>
      <span class="mv-t">${m.label}</span>
      <span class="mv-v num ${m.out?'rem':'add'}">${m.out?'-':'+'}${money(m.amount)}</span>
      ${m.removable?`<button class="mv-x" onclick="deleteSavingsMovement('${m.id}')">🗑</button>`
                   :'<span class="mv-x" style="opacity:.35">🔒</span>'}
    </div>`).join('');
}
// Tecla Enter nos campos faz o mesmo que o botão ao lado.
function onSavingsKey(ev,campo){
  if(ev.key!=='Enter') return;
  ev.preventDefault();
  if(campo==='add') applySavingsAdd(); else applySavingsRemove();
}
// Soma o valor digitado à poupança.
function applySavingsAdd(){
  const el=document.getElementById('savingsAdd'); if(!el) return;
  const n=parseAmount(el.value);
  if(!(n>0)){ showToast('Digite um valor maior que zero'); el.focus(); return; }
  state.savings.balance+=n;
  pushSavingsMovement('entrada',n);
  saveState(); el.value=''; el.blur();
  renderSavingsModal(); renderAll();
  showToast('Incluído na poupança 🐷');
}
// Tira o valor digitado da poupança.
function applySavingsRemove(){
  const el=document.getElementById('savingsRemove'); if(!el) return;
  const n=parseAmount(el.value);
  if(!(n>0)){ showToast('Digite um valor maior que zero'); el.focus(); return; }
  if(n>savingsBalance()){ showToast('Você tem '+money(savingsBalance())+' guardado'); el.focus(); return; }
  state.savings.balance-=n;
  pushSavingsMovement('saida',n);
  saveState(); el.value=''; el.blur();
  renderSavingsModal(); renderAll();
  showToast('Retirado da poupança 📤');
}
// Apaga um movimento e devolve a poupança ao valor de antes.
function deleteSavingsMovement(id){
  const m=(state.savings.history||[]).find(x=>x.id===id); if(!m) return;
  if(!confirm('Excluir este movimento? Os valores voltam ao que eram antes.')) return;
  state.savings.balance += (m.kind==='saida' ? m.amount : -m.amount);
  if(m.kind==='transf'){ const w=findWallet('banco'); if(w) w.balance+=m.amount; }  // devolve ao saldo
  if(state.savings.balance<0) state.savings.balance=0;
  state.savings.history=state.savings.history.filter(x=>x.id!==id);
  saveState(); renderSavingsModal(); renderSendModal(); renderAll(); showToast('Movimento excluído');
}

/* ============================================================
   Enviar dinheiro do saldo para a poupança

   Observação:
   Aqui o dinheiro realmente muda de lugar: sai da conta e vira valor
   guardado. Por isso o saldo do Início cai na mesma hora. Não é despesa
   nem receita — o dinheiro continua sendo dele, só que separado.
   ============================================================ */
let sendHistoryEntry=false;

// Abre a janelinha de enviar para a poupança.
function openSendModal(){
  document.getElementById('sendBack').classList.add('show');
  document.getElementById('sendWin').classList.add('show');
  const el=document.getElementById('sendValue'); if(el) el.value='';
  renderSendModal();
  pushHistoryEntry(); sendHistoryEntry=true;
  setTimeout(()=>{ if(el) el.focus(); },260);
}
// Só esconde a janelinha, sem mexer no histórico.
function hideSendModal(){
  document.getElementById('sendBack').classList.remove('show');
  document.getElementById('sendWin').classList.remove('show');
}
// Fecha a pedido de quem usa (botão ✕ ou toque fora).
function closeSendModal(){
  hideSendModal();
  if(sendHistoryEntry){ sendHistoryEntry=false; if(!nativeBackButton && historyDepth>0) history.back(); }
}
// Atualiza os valores mostrados dentro da janelinha.
function renderSendModal(){
  const a=document.getElementById('sendAvailable'); if(a) a.textContent=money(totalBalance());
  const g=document.getElementById('sendSavings'); if(g) g.textContent=money(savingsBalance());
  const box=document.getElementById('sendMoves'); if(!box) return;
  const list=(state.savings.history||[]).filter(m=>m.kind==='transf').slice(0,4);
  box.innerHTML = !list.length ? '' :
    '<div class="mw-lbl">Últimos envios</div>'+list.map(m=>`<div class="mw-mov">
      <span class="mv-d">${formatDayMonth(m.date)}</span>
      <span class="mv-t">Enviado do saldo</span>
      <span class="mv-v num add">+${money(m.amount)}</span>
      <button class="mv-x" onclick="deleteSavingsMovement('${m.id}')">🗑</button>
    </div>`).join('');
}
// Tecla Enter no campo faz o mesmo que o botão ao lado.
function onSendKey(ev){ if(ev.key!=='Enter') return; ev.preventDefault(); applySendToSavings(); }
// Tira o valor do saldo da conta e guarda na poupança.
function applySendToSavings(){
  const el=document.getElementById('sendValue'); if(!el) return;
  const n=parseAmount(el.value);
  if(!(n>0)){ showToast('Digite um valor maior que zero'); el.focus(); return; }
  const disponivel=totalBalance();
  if(n>disponivel){ showToast('Seu saldo é de '+money(disponivel)); el.focus(); return; }
  const w=findWallet('banco'); if(w) w.balance-=n;
  state.savings.balance+=n;
  pushSavingsMovement('transf',n);
  saveState(); el.value=''; el.blur();
  renderSendModal(); renderAll();
  showToast('Enviado para a poupança 🐷');
}

/* Menu do botão + (canto inferior). */
let fabHistoryEntry=false;

// Abre o menu do botão +.
function openFab(){
  document.getElementById('overlay').classList.add('show');
  document.getElementById('fabMenu').classList.add('show');
  pushHistoryEntry(); fabHistoryEntry=true;
}

// Só esconde o menu, sem mexer no histórico.
function hideFab(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('fabMenu').classList.remove('show');
}

// Fecha o menu a pedido de quem usa (toque fora do menu).
function closeFab(){
  hideFab();
  if(fabHistoryEntry){ fabHistoryEntry=false; if(!nativeBackButton && historyDepth>0) history.back(); }
}

/* ============================================================
   Botão voltar do aparelho

   Observação:
   Esta parte deu bastante trabalho até funcionar. A primeira tentativa
   foi só com o histórico do navegador (pushState + popstate), sem nada
   nativo — no computador funcionava, mas no aparelho o Android fechava
   o app assim mesmo. O WebView do Capacitor não repassa o botão voltar
   para o histórico da página.

   O que resolve é escutar o evento nativo do próprio Capacitor. Como
   ele desliga o comportamento padrão, passa a ser responsabilidade
   daqui decidir tudo: fechar o menu, fechar o formulário, voltar uma
   tela ou, aí sim, encerrar o app.

   Mantive o caminho do histórico como reserva para quando o app roda
   no navegador do computador, onde não existe plugin nativo. Os dois
   caminhos chamam as mesmas funções, então o comportamento é o mesmo
   nos dois lugares.
   ============================================================ */
let nativeBackButton=false;   // true quando o plugin nativo assume o controle
let historyDepth=0;

// Empilha uma entrada de histórico (só no navegador; no app é o plugin que cuida).
function pushHistoryEntry(){
  if(nativeBackButton) return;
  historyDepth++;
  try{ history.pushState({app:true,depth:historyDepth},''); }catch(e){ historyDepth--; }
}

/* Fecha o que estiver por cima da tela (menu ou formulário).
   Devolve true quando fechou alguma coisa — assim quem chamou sabe
   que o toque no voltar já foi usado e não deve trocar de tela. */
function closeTopLayer(){
  const sendWin=document.getElementById('sendWin');
  if(sendWin && sendWin.classList.contains('show')){ hideSendModal(); sendHistoryEntry=false; return true; }
  const savingsWin=document.getElementById('savingsWin');
  if(savingsWin && savingsWin.classList.contains('show')){ hideSavingsModal(); savingsHistoryEntry=false; return true; }
  const fabMenu=document.getElementById('fabMenu');
  if(fabMenu && fabMenu.classList.contains('show')){ hideFab(); fabHistoryEntry=false; return true; }
  if(document.querySelector('.form-screen')){ applyCloseForm(); return true; }
  return false;
}

// Decide o que fazer quando o botão voltar do aparelho é pressionado.
function handleBackButton(){
  if(closeTopLayer()) return;
  if(screenHistory.length){ applyGoBack(); return; }
  exitApp();   // já está no Início e não há mais para onde voltar
}

// Encerra o app (só existe no aparelho; no navegador não faz nada).
function exitApp(){
  const plugin=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if(plugin && plugin.exitApp) plugin.exitApp();
}

/* Liga o botão voltar.

   Observação:
   O plugin pode demorar alguns instantes para ficar disponível depois
   que a tela carrega, então tento algumas vezes antes de desistir e
   cair para o histórico do navegador. Sem isso, em aparelhos mais
   lentos o registro falhava justamente na primeira abertura. */
function setupBackButton(tentativa){
  const plugin=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if(plugin && plugin.addListener){
    nativeBackButton=true;
    plugin.addListener('backButton', handleBackButton);
    return;
  }
  if((tentativa||0) < 10){ setTimeout(function(){ setupBackButton((tentativa||0)+1); }, 200); }
}

// Caminho reserva: botão voltar do navegador, no computador.
window.addEventListener('popstate',function(){
  if(nativeBackButton) return;
  if(historyDepth>0) historyDepth--;
  if(closeTopLayer()) return;
  applyGoBack();
});

/* ---------------------------------------------------------------
   9. INICIALIZAÇÃO
   --------------------------------------------------------------- */
// Liga tudo quando o app abre.
function startApp(){
  setupBackButton();
  applyTheme();
  // nav
  document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>showScreen(b.dataset.nav));
  document.getElementById('fab').onclick=openFab;
  document.getElementById('overlay').onclick=closeFab;
  document.getElementById('savingsBack').onclick=closeSavingsModal;
  document.getElementById('sendBack').onclick=closeSendModal;
  document.querySelectorAll('.fm-item').forEach(b=>b.onclick=()=>openForm(b.dataset.form));
  // extra nav targets (metas/investir/carteiras) via header buttons already wired inline
  showScreen('inicio');
  // Deep links from "Mais" screen to metas/investir
}
/* Funcoes chamadas a partir do HTML gerado (onclick, oninput, etc.).
   Observacao:
   O HTML e montado como texto e inserido com innerHTML, entao os
   handlers inline sao resolvidos no escopo global. Por isso tudo o
   que e chamado a partir do HTML precisa estar exposto em window. */

window.goBack = goBack;
window.openForm = openForm;
window.closeForm = closeForm;
window.openWallet = openWallet;

window.resetData = resetData;
window.addToGoal = addToGoal;

window.selectEmoji = selectEmoji;
window.saveGoal = saveGoal;
window.addPendingItem = addPendingItem;
window.removePendingItem = removePendingItem;
window.updatePendingValue = updatePendingValue;
window.updateFormTotal = updateFormTotal;
window.onCategoryChange = onCategoryChange;
window.onSourceChange = onSourceChange;
window.savePendingEntries = savePendingEntries;
window.saveSingleEntry = saveSingleEntry;
window.editSavedEntry = editSavedEntry;
window.deleteSavedEntry = deleteSavedEntry;
window.formatMoneyInput = formatMoneyInput;
window.setSimulatorMode = setSimulatorMode;
window.toggleSimulatorMenu = toggleSimulatorMenu;
window.updateInvestmentResults = updateInvestmentResults;
window.updateCryptoResults = updateCryptoResults;
window.selectCoin = selectCoin;

window.openSavingsModal = openSavingsModal;

window.closeSendModal = closeSendModal;
window.applySendToSavings = applySendToSavings;
window.onSendKey = onSendKey;
window.closeSavingsModal = closeSavingsModal;
window.applySavingsAdd = applySavingsAdd;
window.applySavingsRemove = applySavingsRemove;
window.deleteSavingsMovement = deleteSavingsMovement;
window.onSavingsKey = onSavingsKey;


if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',startApp);}else{startApp();}
</script>
