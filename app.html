<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Controle Financeiro</title>
<style>
  :root{
    --bg:#eef2f7; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eef2f7;
    --text:#0f172a; --muted:#64748b; --faint:#94a3b8; --border:#e6ebf2;
    --green:#16a34a; --green-d:#15803d; --green-soft:#dcfce7;
    --red:#dc2626; --red-d:#b91c1c; --red-soft:#fee2e2;
    --blue:#2563eb; --blue-soft:#dbeafe;
    --gold:#eab308; --gold-d:#ca8a04;
    --navy:#0f172a; --navy-2:#1e293b;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
    --shadow-lg:0 12px 40px rgba(15,23,42,.18);
    --r:18px; --r-sm:12px;
  }
  html[data-theme="dark"]{
    --bg:#0b1220; --surface:#151e2e; --surface-2:#1b263a; --surface-3:#243044;
    --text:#eef2f7; --muted:#94a3b8; --faint:#64748b; --border:#243044;
    --green-soft:#123023; --red-soft:#3a1620; --blue-soft:#12233f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --shadow-lg:0 16px 50px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;line-height:1.45;
    overscroll-behavior-y:none;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}

  /* ---- App shell: phone frame on desktop ---- */
  #app{
    max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;
    background:var(--bg);position:relative;display:flex;flex-direction:column;
    box-shadow:0 0 0 1px var(--border);overflow:hidden;
  }
  @media(min-width:480px){ #app{margin-top:0;min-height:100vh} }

  /* ---- Header ---- */
  .hdr{
    background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 18px 20px;
    position:sticky;top:0;z-index:20;
  }
  .hdr-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hdr-icn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:rgba(255,255,255,.08);font-size:18px}
  .hdr-icn:active{background:rgba(255,255,255,.16)}
  .hdr-back{display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 14px 0 10px;border-radius:11px;
    background:#f1f5f9;color:#0f172a;font-size:14px;font-weight:700;white-space:nowrap;flex-shrink:0;
    box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .hdr-back:active{background:#e2e8f0;transform:scale(.97)}
  .brand{display:flex;align-items:center;gap:10px;flex-direction:column;text-align:center;flex:1}
  .brand .logo{font-size:26px;filter:drop-shadow(0 2px 6px rgba(234,179,8,.5))}
  .brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.02em}
  .brand p{font-size:11.5px;margin:2px 0 0;color:#94a3b8}
  .hdr-simple{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 16px 16px}
  .hdr-simple h1{font-size:18px;margin:0;font-weight:700;flex:1;text-align:center}
  .hdr-simple.green{background:var(--green)}
  .hdr-simple.red{background:var(--red)}
  .hdr-simple.blue{background:var(--blue)}
  .hdr-simple.navy{background:var(--navy)}

  /* ---- Scroll area ---- */
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:96px}
  .screen{display:none;padding:16px 14px 0;animation:fade .28s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.screen{animation:none}}

  /* ---- Cards ---- */
  .card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);
    border:1px solid var(--border);margin-bottom:14px}
  .card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .card-title h2{font-size:15px;margin:0;font-weight:700}
  .card-title .pill{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
  .sec-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:18px 4px 10px}

  /* ---- Balance hero ---- */
  .hero{background:linear-gradient(135deg,var(--navy) 0%,#1e293b 100%);color:#fff;
    border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;pointer-events:none;
    background:radial-gradient(circle,rgba(234,179,8,.16),transparent 70%)}
  .hero .lbl{font-size:12.5px;color:#94a3b8;display:flex;align-items:center;gap:6px}
  .hero .val{font-size:34px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
  .hero .sub{font-size:12.5px;color:#cbd5e1}
  /* Botão de enviar para a poupança, colado no saldo */
  .hero .val-line{display:flex;align-items:center;gap:10px;position:relative;z-index:3}
  .hero .send-btn{width:27px;height:27px;border-radius:50%;font-size:14px;font-weight:800;line-height:1;
    color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.34);
    display:grid;place-items:center;flex-shrink:0}
  .hero .send-btn:active{background:rgba(255,255,255,.28);transform:scale(.92)}
  .mw-hint{font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}

  /* Poupança dentro do cartão de saldo */
  .hero .pig{position:relative;z-index:3;margin-top:2px}
  .hero .pig-k{font-size:12.5px;font-weight:700;color:#22c55e}
  .hero .pig-line{display:flex;align-items:center;gap:9px;margin-top:1px}
  .hero .pig-v{font-size:17px;font-weight:800;color:#22c55e;letter-spacing:-.01em}
  .hero .pig-btn{width:25px;height:25px;border-radius:50%;font-size:15px;font-weight:800;line-height:1;
    color:#22c55e;background:rgba(34,197,94,.16);border:1px solid rgba(34,197,94,.5);
    display:grid;place-items:center;flex-shrink:0}
  .hero .pig-btn:active{background:rgba(34,197,94,.34);transform:scale(.92)}

  /* Janelinha da poupança */
  .mw-back{position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:90;opacity:0;pointer-events:none;
    transition:opacity .25s}
  .mw-back.show{opacity:1;pointer-events:auto}
  .mw{position:fixed;z-index:91;left:50%;top:50%;width:min(92vw,370px);max-height:85vh;overflow-y:auto;
    transform:translate(-50%,-48%) scale(.96);background:var(--surface);border-radius:20px;padding:18px;
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
  .mw.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .mw-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
  .mw-head h3{margin:0;font-size:16.5px;font-weight:800}
  .mw-x{width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--muted);font-size:14px}
  .mw-x:active{background:var(--border)}
  .mw-bal{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;
    padding:12px;text-align:center;margin-bottom:15px}
  .mw-bal .k{font-size:11.5px;color:var(--muted);font-weight:600}
  .mw-bal .v{font-size:25px;font-weight:800;color:var(--green);margin-top:2px;letter-spacing:-.02em}
  .mw-row{display:flex;gap:8px;align-items:stretch}
  .mw-row .inp{flex:1;min-width:0}
  .mw-go{width:54px;border-radius:12px;font-size:19px;font-weight:800;color:#fff;flex-shrink:0}
  .mw-go.add{background:var(--green)}
  .mw-go.rem{background:var(--red)}
  .mw-go:active{filter:brightness(.9)}
  .mw-lbl{font-size:11.5px;font-weight:700;color:var(--muted);margin:2px 0 7px 2px;text-transform:uppercase;letter-spacing:.04em}
  .mw-mov{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:11px;margin-bottom:6px}
  .mw-mov .mv-d{font-size:12px;color:var(--muted);font-weight:600}
  .mw-mov .mv-t{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .mw-mov .mv-v{font-size:13.5px;font-weight:800;margin-left:auto}
  .mw-mov .mv-v.add{color:var(--green)}
  .mw-mov .mv-v.rem{color:var(--red)}
  .mw-mov .mv-x{width:26px;height:26px;border-radius:8px;font-size:12px;color:var(--faint);flex-shrink:0}
  .mw-mov .mv-x:active{background:var(--red-soft);color:var(--red)}

  .eye{background:rgba(255,255,255,.08);border-radius:8px;width:34px;height:34px;display:grid;
    place-items:center;font-size:15px;position:relative;z-index:3;cursor:pointer}
  .eye:active{background:rgba(255,255,255,.2);transform:scale(.94)}

  /* month summary 3-cols */
  .msum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
  .msum .col{text-align:center;padding:4px 6px;position:relative}
  .msum .col+.col::before{content:"";position:absolute;left:0;top:14%;height:72%;width:1px;background:var(--border)}
  .msum .k{font-size:11.5px;font-weight:700;margin-bottom:4px}
  .msum .v{font-size:15px;font-weight:800}
  .k.in{color:var(--green)} .k.out{color:var(--red)} .k.bal{color:var(--blue)}

  /* ---- Wallet cards ---- */
  .wallets-row{display:flex;align-items:center;gap:6px}
  .wnav{width:30px;height:64px;flex-shrink:0;border-radius:12px;background:var(--surface);border:1px solid var(--border);
    box-shadow:var(--shadow);font-size:22px;font-weight:700;color:var(--muted);display:grid;place-items:center;transition:opacity .2s,transform .1s}
  .wnav:active{transform:scale(.92)}
  .wnav:disabled{opacity:.35;cursor:default}
  .wallets-row .wallets-scroll{flex:1;margin:0}
  .wallets-scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scroll-snap-type:x mandatory}
  .wallets-scroll::-webkit-scrollbar{display:none}
  .wcard{min-width:200px;scroll-snap-align:start;background:var(--surface);border-radius:var(--r);
    border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;flex-shrink:0}
  .wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .wgrid .wcard{min-width:0}
  .wcard .band{height:5px}
  .wcard .body{padding:14px}
  .wcard .top{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .wcard .emoji{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
  .wcard .nm{font-size:13px;font-weight:700;line-height:1.2}
  .wcard .ty{font-size:10.5px;color:var(--faint)}
  .wcard .bal{font-size:20px;font-weight:800;margin:2px 0 3px}
  .wcard .flow{display:flex;gap:10px;font-size:10.5px;margin-top:8px;color:var(--muted)}
  .wcard .flow b{font-weight:700}
  .wcard .up b{color:var(--green)} .wcard .dn b{color:var(--red)}
  .wcard .barwrap{height:5px;background:var(--surface-3);border-radius:3px;margin-top:9px;overflow:hidden}
  .wcard .barfill{height:100%;border-radius:3px;transition:width .5s}
  .wcard .last{font-size:10px;color:var(--faint);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- Quick actions ---- */
  .qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .qa button{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
    padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--shadow);transition:transform .1s}
  .qa button:active{transform:scale(.95)}
  .qa .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px}
  .qa .tx{font-size:11px;font-weight:600;text-align:center;line-height:1.2;color:var(--text)}

  /* overview bars */
  .ov-row{display:flex;align-items:center;gap:11px;padding:9px 0}
  .ov-row+.ov-row{border-top:1px solid var(--border)}
  .ov-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
  .ov-mid{flex:1;min-width:0}
  .ov-mid .t{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
  .ov-mid .t .amt{font-weight:800}
  .ov-track{height:6px;background:var(--surface-3);border-radius:3px;margin-top:6px;overflow:hidden}
  .ov-fill{height:100%;border-radius:3px;transition:width .6s}

  /* ---- Donut + legend ---- */
  .donut-wrap{display:flex;align-items:center;gap:16px}
  .donut{flex-shrink:0}
  .legend{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  .lg-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .lg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .lg-nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lg-pc{font-weight:700}
  .donut-note{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);line-height:1.35}
  .donut-center{font-size:11px;fill:var(--muted)}
  .donut-total{font-size:15px;font-weight:800;fill:var(--text)}

  /* ---- Transaction list ---- */
  .tx-tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
  .tx-tabs button{flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s}
  .tx-tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .tx-month{font-size:13px;font-weight:700;color:var(--muted);margin:16px 4px 8px}
  .tx-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow);transition:transform .1s}
  .tx-row:active{transform:scale(.99)}
  .tx-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
  .tx-mid{flex:1;min-width:0}
  .tx-mid .d{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx-mid .m{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx-amt{font-size:14.5px;font-weight:800;white-space:nowrap;text-align:right}
  .tx-amt.in{color:var(--green)} .tx-amt.out{color:var(--red)}
  .tx-amt small{display:block;font-size:9.5px;font-weight:600;color:var(--faint)}
  .del-x{opacity:.5;font-size:16px;padding:4px}

  .empty{text-align:center;padding:44px 20px;color:var(--muted)}
  .empty .e{font-size:44px;margin-bottom:10px;opacity:.7}
  .empty p{font-size:14px;margin:0}

  /* ---- Goals ---- */
  .goal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;
    box-shadow:var(--shadow);margin-bottom:12px}
  .goal .g-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .goal .g-emoji{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;
    background:var(--gold);flex-shrink:0}
  .goal .g-nm{font-size:15px;font-weight:700}
  .goal .g-sub{font-size:12px;color:var(--muted)}
  .goal .g-track{height:10px;background:var(--surface-3);border-radius:6px;overflow:hidden}
  .goal .g-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-d));border-radius:6px;transition:width .6s}
  .goal .g-nums{display:flex;justify-content:space-between;margin-top:10px;font-size:12px}
  .goal .g-nums b{font-weight:800}
  .goal .g-add{margin-top:12px;width:100%;padding:10px;border-radius:10px;background:var(--surface-2);
    border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--gold-d)}

  /* ---- Stats ---- */
  .bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding:0 4px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bar-pair{display:flex;gap:4px;align-items:flex-end;flex:1;width:100%;justify-content:center}
  .bar{width:14px;border-radius:5px 5px 0 0;min-height:3px;transition:height .6s}
  .bar.in{background:var(--green)} .bar.out{background:var(--red)}
  .bar-lbl{font-size:10.5px;color:var(--muted);font-weight:600}
  .line-svg{width:100%;height:auto;display:block}

  /* ---- Investment simulator ---- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
  .chips::-webkit-scrollbar{display:none}
  .chips-row{display:flex;align-items:center;gap:6px}
  .chips-row .wnav{height:40px}
  .chips-row .chips{flex:1;margin:0}
  /* ---- Simulador (modo + investimentos + cripto) ---- */
  .mode-dd{position:relative;margin-bottom:14px}
  .mode-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;
    border-radius:14px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;box-shadow:var(--shadow)}
  .mode-btn .mdd-ar{font-size:14px;opacity:.8}
  .mode-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:var(--surface);
    border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden}
  .mode-menu button{display:block;width:100%;text-align:left;padding:14px 16px;font-size:14.5px;font-weight:600;color:var(--text)}
  .mode-menu button:active{background:var(--surface-2)}
  .mode-menu button+button{border-top:1px solid var(--border)}
  .sim-hint{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.4}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .inv-invested{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:12px}
  .prazo-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
  .prazo-row::-webkit-scrollbar{display:none}
  .prazo-chip{flex:1;min-width:58px;padding:9px 6px;border-radius:10px;border:1.5px solid var(--border);
    background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  .prazo-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .prazo-chip:active{transform:scale(.96)}
  .inv-invested b{color:var(--text)}
  .inv-card{display:flex;gap:11px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);
    border-radius:14px;padding:12px;margin-bottom:10px}
  .inv-card.win{border-color:var(--green);background:var(--green-soft)}
  .ic-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
  .ic-main{flex:1;min-width:0}
  .ic-name{font-size:14px;font-weight:800}
  .win-tag{font-size:10.5px;font-weight:700;color:var(--green);background:rgba(22,163,74,.14);padding:1px 6px;border-radius:6px;margin-left:4px}
  .ic-note{font-size:11px;color:var(--muted);margin:1px 0 6px}
  .ic-line{font-size:13.5px}
  .ic-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .ic-pct{font-size:14px;font-weight:800;white-space:nowrap;flex-shrink:0}
  .crypto-chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .cchip{flex:1;min-width:96px;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;border-radius:12px;
    border:1.5px solid var(--border);background:var(--surface-2);font-size:13px;font-weight:700;color:var(--muted)}
  .cchip .cc-sym{font-size:16px;font-weight:800}
  .cy-buy{display:flex;align-items:center;gap:13px}
  .cyb-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:800;flex-shrink:0}
  .cyb-k{font-size:12px;color:var(--muted)}
  .cyb-v{font-size:21px;font-weight:800;letter-spacing:-.02em;word-break:break-all}
  .cyb-s{font-size:11.5px;color:var(--muted);margin-top:1px}
  .cy-target{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
  .cyt-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
  .cyt-row b{font-size:16px;font-weight:800}
  .cyt-res{font-size:14px;font-weight:800;margin-top:6px;text-align:center;padding:8px;border-radius:10px;background:var(--surface-2)}
  .scn-row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--border)}
  .scn-row:last-child{border-bottom:none}
  .scn-l{font-size:13.5px;font-weight:700;display:flex;flex-direction:column}
  .scn-price{font-size:10.5px;color:var(--muted);font-weight:500;margin-top:1px}
  .scn-r{text-align:right;display:flex;flex-direction:column}
  .scn-r b{font-size:14.5px;font-weight:800}
  .scn-r span{font-size:11.5px;font-weight:700;margin-top:1px}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:8px 13px;border-radius:20px;font-size:12.5px;font-weight:600;
    background:var(--surface-2);border:1px solid var(--border);color:var(--muted);flex-shrink:0}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
  .field .inp{display:flex;align-items:center;background:var(--surface-2);border:1.5px solid var(--border);
    border-radius:12px;padding:0 14px;transition:border-color .2s}
  .field .inp:focus-within{border-color:var(--green)}
  .field .inp span{color:var(--muted);font-size:14px}
  .field input,.field select,.field textarea{flex:1;border:none;background:transparent;padding:13px 6px;
    color:var(--text);outline:none;width:100%}
  .field select{padding:13px 6px 13px 10px}
  .field textarea{resize:vertical;min-height:60px}
  .sim-res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .sim-box{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px}
  .sim-box .k{font-size:11px;color:var(--muted);font-weight:600}
  .sim-box .v{font-size:18px;font-weight:800;margin-top:3px}
  .sim-box.big{grid-column:span 2;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;border:none}
  .sim-box.big .k{color:rgba(255,255,255,.85)}
  .proj-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px}
  .proj-table th,.proj-table td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--border)}
  .proj-table th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
  .proj-table td:first-child,.proj-table th:first-child{text-align:left;font-weight:700}
  .disclaimer{font-size:11px;color:var(--faint);background:var(--surface-2);border-radius:10px;
    padding:11px 13px;margin-top:12px;line-height:1.5;border:1px solid var(--border)}

  /* insight cards */
  .insight{display:flex;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:14px;box-shadow:var(--shadow);margin-bottom:10px;align-items:flex-start}
  .insight .i-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
  .insight .i-tx{font-size:13px;line-height:1.5}
  .insight .i-tx b{font-weight:800}
  .ins-ok{background:var(--green-soft)} .ins-warn{background:#fef3c7} .ins-bad{background:var(--red-soft)}
  html[data-theme="dark"] .ins-warn{background:#3a2e10}

  /* settings rows */
  .set-row{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);
    padding:15px;box-shadow:var(--shadow);border-radius:14px;margin-bottom:9px}
  .set-row .s-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;
    background:var(--surface-2);flex-shrink:0}
  .set-row .s-mid{flex:1}
  .set-row .s-t{font-size:14px;font-weight:600}
  .set-row .s-d{font-size:12px;color:var(--muted)}
  .set-row .s-arrow{color:var(--faint);font-size:18px}
  .toggle{width:50px;height:30px;border-radius:16px;background:var(--surface-3);position:relative;transition:background .25s;flex-shrink:0}
  .toggle.on{background:var(--green)}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;transition:transform .25s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
  .toggle.on::after{transform:translateX(20px)}

  /* ---- Bottom nav + FAB ---- */
  .navbar{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;z-index:30;
    background:var(--surface);border-top:1px solid var(--border);
    display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;
    padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 20px rgba(15,23,42,.06)}
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 0 9px;color:var(--faint)}
  .nav-btn.on{color:var(--green)}
  .nav-btn .ni{font-size:20px}
  .nav-btn .nl{font-size:10px;font-weight:600}
  .fab{width:60px;height:60px;border-radius:50%;background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:30px;margin:-24px auto 0;
    box-shadow:0 8px 24px rgba(22,163,74,.45);transition:transform .15s;font-weight:300}
  .fab:active{transform:scale(.9)}

  /* ---- FAB menu (sheet) ---- */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:40;opacity:0;pointer-events:none;
    transition:opacity .25s;backdrop-filter:blur(2px)}
  .overlay.show{opacity:1;pointer-events:auto}
  .fab-menu{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;z-index:50;
    background:var(--surface);border-radius:24px 24px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom) + 20px);
    transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
  .fab-menu.show{transform:translateY(0)}
  .grip{width:40px;height:4px;background:var(--border);border-radius:2px;margin:4px auto 14px}
  .fab-menu h3{margin:0 0 14px;font-size:16px;text-align:center;font-weight:800}
  .fm-item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;margin-bottom:6px;
    background:var(--surface-2);border:1px solid var(--border);width:100%;text-align:left;transition:transform .1s}
  .fm-item:active{transform:scale(.98)}
  .fm-item .fi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
  .fm-item .ft{font-size:15px;font-weight:700}
  .fm-item .fd{font-size:12px;color:var(--muted)}

  /* ---- Full-screen form ---- */
  .form-screen{position:fixed;inset:0;max-width:460px;margin:0 auto;background:var(--surface);z-index:60;
    display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .form-screen.show{transform:translateX(0)}
  .form-body{flex:1;overflow-y:auto;padding:18px 16px 40px}
  .amount-display{text-align:center;padding:22px 0 8px}
  .amount-display .cur{font-size:20px;font-weight:600;vertical-align:top}
  .amount-display input{font-size:44px;font-weight:800;border:none;background:transparent;text-align:center;
    width:100%;outline:none;color:inherit}
  .amount-display.green input,.amount-display.green .cur{color:var(--green)}
  .amount-display.red input,.amount-display.red .cur{color:var(--red)}
  .amount-display.blue input,.amount-display.blue .cur{color:var(--blue)}
  .amount-display.gold input,.amount-display.gold .cur{color:var(--gold-d)}
  .amount-display .tot{font-size:44px;font-weight:800;display:inline-block;min-width:40px}
  .amount-display.green .tot{color:var(--green)} .amount-display.red .tot{color:var(--red)}
  .form-total-sub{text-align:center;font-size:12px;color:var(--muted);margin:-4px 0 16px}
  .entry-row{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
  .entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .entry-n{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .entry-del{color:var(--red);font-size:12.5px;font-weight:600;padding:2px 6px}
  .entry-row .field{margin-bottom:10px}
  .entry-row .field:last-child{margin-bottom:0}
  .entry-row .inp{background:var(--surface)}
  .add-row-btn{width:100%;padding:13px;border-radius:12px;border:1.5px dashed var(--border);background:transparent;
    font-size:14px;font-weight:700;color:var(--muted);transition:transform .1s}
  .add-row-btn:active{transform:scale(.98)}
  .add-row-btn.green{color:var(--green);border-color:var(--green)}
  .add-row-btn.red{color:var(--red);border-color:var(--red)}
  .items-head{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 2px 8px}
  .litem{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:12px;padding:9px 10px;margin-bottom:8px}
  .litem .li-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
  .litem .li-main{flex:1;min-width:0}
  .litem .li-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .litem .li-sub{font-size:11px;color:var(--muted);margin-top:1px}
  .litem .li-val{display:flex;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--border);
    border-radius:9px;padding:5px 8px;max-width:118px}
  .litem .li-val span{font-size:12px;color:var(--muted)}
  .litem .li-val input{width:74px;border:none;background:transparent;outline:none;text-align:right;
    font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  .litem .li-del{flex-shrink:0;font-size:14px;padding:4px;opacity:.75}
  .litem .li-del:active{transform:scale(.9)}
  .saved-head{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
    margin:18px 2px 8px;padding-top:14px;border-top:1px dashed var(--border)}
  .litem .li-fixed{font-size:14px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text)}
  .litem .li-edit{flex-shrink:0;font-size:14px;padding:4px;opacity:.8}
  .litem .li-edit:active{transform:scale(.9)}
  .bene-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .bene-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 13px;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
  .bene-card .be-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
  .bene-card .be-k{font-size:10.5px;color:var(--muted);font-weight:600;line-height:1.2}
  .bene-card .be-v{font-size:15px;font-weight:800;margin-top:1px}
  .hist-btn{margin-top:14px;width:100%;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);color:#fff;font-size:13.5px;font-weight:700}
  .hist-btn:active{background:rgba(255,255,255,.16)}
  .rsum-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 4px;
    border-bottom:1px solid var(--border)}
  .rsum-row:last-child{border-bottom:none}
  .rsum-row.static{cursor:default}
  .rs-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
  .rs-main{flex:1;min-width:0}
  .rs-k{font-size:13.5px;font-weight:600;color:var(--text)}
  .rs-sub{font-size:11px;color:var(--muted);margin-top:1px}
  .rs-v{font-size:15px;font-weight:800;white-space:nowrap}
  .rs-ch{color:var(--faint);font-size:20px;margin-left:2px}
  .lt-card{text-align:center}
  .lt-k{font-size:12px;color:var(--muted);font-weight:600}
  .lt-v{font-size:30px;font-weight:800;margin-top:3px}
  .lt-split{display:flex;flex-direction:column;gap:3px;margin-top:11px;padding-top:11px;border-top:1px solid var(--border);
    font-size:12px;color:var(--muted)}
  .lt-split b{color:var(--text)}
  .hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .hcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow)}
  .hc-k{font-size:11.5px;color:var(--muted);font-weight:600}
  .hc-v{font-size:19px;font-weight:800;margin-top:3px}
  .hc-s{font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.3}
  .cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .cmp-btn{padding:14px 10px;border-radius:14px;border:1px solid var(--border);background:var(--surface);
    box-shadow:var(--shadow);font-size:13.5px;font-weight:700;color:var(--text)}
  .cmp-btn:active{transform:scale(.98)}
  .cmp-toggle{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:14px}
  .cmp-toggle button{flex:1;padding:9px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);background:transparent}
  .cmp-toggle button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .cmp-legend{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--muted);margin-top:4px}
  .cmp-legend span{display:flex;align-items:center;gap:5px}
  .cmp-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .save-btn{position:sticky;bottom:0;width:100%;padding:16px;border-radius:14px;font-size:16px;font-weight:800;
    color:#fff;margin-top:8px}
  .save-btn.green{background:var(--green)} .save-btn.red{background:var(--red)}
  .save-btn.blue{background:var(--blue)} .save-btn.gold{background:var(--gold-d)}
  .save-btn:active{filter:brightness(.92)}

  .seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin-bottom:6px}
  .seg button{flex:1;padding:11px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

  /* suggestion hint */
  .suggest{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--green-d);
    background:var(--green-soft);border-radius:10px;padding:9px 12px;margin-top:-6px;margin-bottom:14px}
  html[data-theme="dark"] .suggest{color:#5eead4}

  /* toast */
  .toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);z-index:80;
    background:var(--navy);color:#fff;padding:13px 20px;border-radius:30px;font-size:13.5px;font-weight:600;
    box-shadow:var(--shadow-lg);opacity:0;transition:all .3s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  html[data-theme="dark"] .toast{background:var(--gold);color:#0f172a}

  main::-webkit-scrollbar{width:0}
  .fluxo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fluxo .fx{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px;text-align:center}
  .fluxo .fx .k{font-size:11px;color:var(--muted);font-weight:600}
  .fluxo .fx .v{font-size:17px;font-weight:800;margin-top:4px}
</style>
</head>
<body>
<div id="app">

  <!-- Dynamic header -->
  <div id="header"></div>

  <main id="main">
    <section id="scr-inicio" class="screen active"></section>
    <section id="scr-transacoes" class="screen"></section>
    <section id="scr-carteiras" class="screen"></section>
    <section id="scr-estatisticas" class="screen"></section>
    <section id="scr-metas" class="screen"></section>
    <section id="scr-investir" class="screen"></section>
    <section id="scr-mais" class="screen"></section>
    <section id="scr-carteira-det" class="screen"></section>
    <section id="scr-historico" class="screen"></section>
    <section id="scr-lista" class="screen"></section>
    <section id="scr-meses" class="screen"></section>
    <section id="scr-mesdet" class="screen"></section>
    <section id="scr-comparar" class="screen"></section>
  </main>

  <!-- Bottom nav -->
  <nav class="navbar">
    <button class="nav-btn on" data-nav="inicio"><span class="ni">🏠</span><span class="nl">Início</span></button>
    <button class="nav-btn" data-nav="transacoes"><span class="ni">📋</span><span class="nl">Transações</span></button>
    <button class="fab" id="fab">+</button>
    <button class="nav-btn" data-nav="estatisticas"><span class="ni">📊</span><span class="nl">Relatórios</span></button>
    <button class="nav-btn" data-nav="mais"><span class="ni">⚙️</span><span class="nl">Mais</span></button>
  </nav>
</div>

<!-- FAB menu -->
<div class="overlay" id="overlay"></div>
<div class="fab-menu" id="fabMenu">
  <div class="grip"></div>
  <h3>O que deseja adicionar?</h3>
  <button class="fm-item" data-form="receita">
    <div class="fi" style="background:var(--green-soft);color:var(--green)">💰</div>
    <div><div class="ft">Nova Receita</div><div class="fd">Salário, benefícios, vendas...</div></div>
  </button>
  <button class="fm-item" data-form="despesa">
    <div class="fi" style="background:var(--red-soft);color:var(--red)">🛒</div>
    <div><div class="ft">Nova Despesa</div><div class="fd">Contas, compras, gastos...</div></div>
  </button>
  <button class="fm-item" data-form="transferencia">
    <div class="fi" style="background:var(--blue-soft);color:var(--blue)">🔄</div>
    <div><div class="ft">Transferência</div><div class="fd">Mover entre carteiras</div></div>
  </button>
  <button class="fm-item" data-form="meta">
    <div class="fi" style="background:#fef9c3;color:var(--gold-d)">🎯</div>
    <div><div class="ft">Objetivo Financeiro</div><div class="fd">Criar uma nova meta</div></div>
  </button>
</div>

<!-- Janelinha da poupança -->
<div class="mw-back" id="savingsBack"></div>
<div class="mw" id="savingsWin">
  <div class="mw-head">
    <h3>🐷 Poupança</h3>
    <button class="mw-x" onclick="closeSavingsModal()">✕</button>
  </div>
  <div class="mw-bal">
    <div class="k">Guardado hoje</div>
    <div class="v num" id="savingsBalanceView">R$ 0,00</div>
  </div>
  <div class="field">
    <label>Incluir valor</label>
    <div class="mw-row">
      <div class="inp"><span>R$</span><input id="savingsAdd" inputmode="decimal" placeholder="0,00"
        oninput="formatMoneyInput(this)" onkeydown="onSavingsKey(event,'add')"></div>
      <button class="mw-go add" onclick="applySavingsAdd()">↵</button>
    </div>
  </div>
  <div class="field">
    <label>Retirar valor</label>
    <div class="mw-row">
      <div class="inp"><span>R$</span><input id="savingsRemove" inputmode="decimal" placeholder="0,00"
        oninput="formatMoneyInput(this)" onkeydown="onSavingsKey(event,'remove')"></div>
      <button class="mw-go rem" onclick="applySavingsRemove()">↵</button>
    </div>
  </div>
  <div id="savingsMoves"></div>
</div>

<!-- Janelinha de enviar para a poupança -->
<div class="mw-back" id="sendBack"></div>
<div class="mw" id="sendWin">
  <div class="mw-head">
    <h3>↗ Enviar para a poupança</h3>
    <button class="mw-x" onclick="closeSendModal()">✕</button>
  </div>
  <div class="mw-bal">
    <div class="k">Disponível no seu saldo</div>
    <div class="v num" id="sendAvailable">R$ 0,00</div>
  </div>
  <div class="field">
    <label>Quanto você quer enviar</label>
    <div class="mw-row">
      <div class="inp"><span>R$</span><input id="sendValue" inputmode="decimal" placeholder="0,00"
        oninput="formatMoneyInput(this)" onkeydown="onSendKey(event)"></div>
      <button class="mw-go add" onclick="applySendToSavings()">↵</button>
    </div>
  </div>
  <div class="mw-hint">O valor sai do seu saldo e passa a contar como dinheiro guardado.
    <br>Na poupança hoje: <b id="sendSavings">R$ 0,00</b></div>
  <div id="sendMoves"></div>
</div>

<!-- Full-screen forms mount here -->
<div id="formMount"></div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONTROLE FINANCEIRO
   Aplicativo de finanças pessoais em arquivo único.

   Organização deste arquivo:
     1. Configuração e catálogos
     2. Estado e persistência
     3. Formatação e utilitários
     4. Cálculos (resumos do mês, saldos, categorias)
     5. Telas
     6. Formulários de lançamento
     7. Ajustes do app
     8. Navegação
     9. Inicialização

   Convenções: nomes de código em inglês, comentários em português.
   Nada aqui depende de bibliotecas externas — os gráficos são SVG
   montado na mão e os dados ficam no próprio aparelho.
   ============================================================ */

/* ---------------------------------------------------------------
   2. ESTADO E PERSISTÊNCIA
   --------------------------------------------------------------- */

/* Observação:
   O localStorage é bloqueado em algumas situações (aba anônima,
   WebView com cookies desativados). Em vez de deixar o app quebrar,
   o objeto abaixo cai para um armazenamento em memória: o usuário
   perde os dados ao fechar, mas o app continua funcionando. */
const STORAGE_KEY='controleFinanceiroV9';
const storage={
  save(d){ try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch(e){window.__mem=JSON.parse(JSON.stringify(d));} },
  load(){ try{const d=localStorage.getItem(STORAGE_KEY);return d?JSON.parse(d):null;}catch(e){return window.__mem||null;} }
};

/* ---------------------------------------------------------------
   1. CONFIGURAÇÃO E CATÁLOGOS
   Categorias, carteiras e as regras que ligam uma coisa à outra.
   --------------------------------------------------------------- */
const EXPENSE_CATEGORIES={
  Moradia:{e:'🏠',c:'#3b82f6'}, Mercado:{e:'🛒',c:'#ef4444'}, Farmácia:{e:'💊',c:'#14b8a6'},
  Educação:{e:'📚',c:'#6366f1'}, Saúde:{e:'⚕️',c:'#06b6d4'}, Combustível:{e:'⛽',c:'#f59e0b'},
  Uber:{e:'🚗',c:'#0ea5e9'}, Restaurante:{e:'🍴',c:'#ec4899'}, Lazer:{e:'🎮',c:'#8b5cf6'},
  Streaming:{e:'📺',c:'#e11d48'}, Internet:{e:'🌐',c:'#22c55e'}, Água:{e:'💧',c:'#0891b2'},
  Energia:{e:'⚡',c:'#eab308'}, Telefone:{e:'📱',c:'#64748b'}, Transporte:{e:'🚌',c:'#f97316'},
  'Cartão de Crédito/Débito':{e:'💳',c:'#8b5cf6'}, Outros:{e:'📦',c:'#94a3b8'}
};
const INCOME_CATEGORIES={
  Salário:{e:'💼',c:'#16a34a'}, 'R$ Extras':{e:'✨',c:'#0d9488'}, 'Vale Alimentação':{e:'🍽️',c:'#f97316'},
  'Vale Transporte':{e:'🚌',c:'#f59e0b'}
};
/* Categoria de despesa -> carteira sugerida (nome) */
const SUGGESTED_SOURCE={ Mercado:'Vale Alimentação', Transporte:'Vale Transporte' };
/* Entrada: categoria -> carteira de destino (não há mais campo manual) */
const INCOME_TARGET_WALLET={ 'Salário':'banco', 'R$ Extras':'banco', 'Vale Alimentação':'va', 'Vale Transporte':'vt' };
/* Carteiras de benefício não entram no Saldo Total */
const BENEFIT_WALLETS=['va','vt'];
/* A poupança não é uma carteira: é um dinheiro guardado à parte, com
   saldo próprio. Aqui ela ganha um código só para marcar de onde saiu
   uma despesa paga com ela. */
const SAVINGS_WALLET='poup';
/* Despesa: categorias que também podem ser pagas com vale */
const EXPENSES_WITH_SOURCE=['Mercado','Transporte','Combustível'];
/* De onde sai o dinheiro de uma despesa. */
const PAYMENT_SOURCES=[
  {key:'sal',     label:'💼 Salário + renda extra', wallet:'banco'},
  {key:'poup',    label:'🐷 Poupança',              wallet:SAVINGS_WALLET},
  {key:'valim',   label:'🍽️ Vale Alimentação',      wallet:'va'},
  {key:'vtransp', label:'🚌 Vale Transporte',       wallet:'vt'}
];
/* Lançamentos antigos gravaram a origem "ext" (extras), que saía da
   mesma conta do salário. Ela continua sendo entendida aqui para as
   despesas antigas não perderem a legenda. */
const LEGACY_SOURCES={ext:{key:'ext',label:'✨ Extras',wallet:'banco'}};
// Devolve a origem de pagamento pelo código gravado na despesa.
function paymentSource(key){
  return PAYMENT_SOURCES.find(o=>o.key===key) || LEGACY_SOURCES[key] || PAYMENT_SOURCES[0];
}

/* Estrutura inicial usada na primeira vez que o app abre. */
// Estrutura inicial usada na primeira vez que o app abre.
function createInitialData(){
  const w=(id,name,emoji,color,balance,type)=>({id,name,emoji,color,balance,type});
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth();
  const d=n=>new Date(y,m,n).toISOString().slice(0,10);
  return {
    user:{name:''},        // fica em branco: quem usa preenche nos ajustes
    settings:{theme:'light',hideValues:false},
    wallets:[
      w('banco','Conta Bancária','🏦','#2563eb',0,'Conta'),
      w('va','Vale Alimentação','🍽️','#f97316',0,'Benefício'),
      w('vt','Vale Transporte','🚌','#f59e0b',0,'Benefício'),
    ],
    transactions:[],
    goals:[],
    savings:{balance:0,history:[]}   // poupança: saldo e movimentos próprios
  };
}
// Gera um identificador curto para transações, metas e carteiras.
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}


let state = storage.load() || createInitialData();

/* Completa campos que não existiam nas versões anteriores.

   Observação:
   Quem já usa o app tem no aparelho um estado salvo sem a poupança.
   Sem esta checagem o app quebraria na primeira tela ao tentar ler um
   campo que não existe naquele arquivo antigo. */
function ensureStateShape(){
  if(!state.settings) state.settings={theme:'light',hideValues:false};
  if(!state.savings) state.savings={balance:0,history:[]};
  if(typeof state.savings.balance!=='number') state.savings.balance=0;
  if(!Array.isArray(state.savings.history)) state.savings.history=[];
}
ensureStateShape();

// Grava o estado atual no aparelho.
function saveState(){ storage.save(state); }

/* ---------------------------------------------------------------
   3. FORMATAÇÃO E UTILITÁRIOS
   --------------------------------------------------------------- */
const HIDDEN_MASK='––––––';
/* Observação:
   São dois formatadores de propósito. money() e moneyShort() respeitam
   o botão do olho e escondem o valor quando ele está ligado; já
   formatMoney() sempre mostra. Os simuladores usam formatMoney porque
   ali o número é hipotético, não é o dinheiro da pessoa — esconder
   aquilo não protegeria nada e só atrapalharia. */
const money = n => (state.settings.hideValues ? HIDDEN_MASK :
  'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}));
const moneyShort = n => (state.settings.hideValues ? HIDDEN_MASK :
  'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}));
const formatMoney = n => 'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const formatNumber = n => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1});
const formatPercent = n => Number(n||0).toFixed(1).replace('.',',');
// Devolve o emoji e a cor de uma categoria.
function categoryInfo(type,cat){ const C=(type==='receita'?INCOME_CATEGORIES:EXPENSE_CATEGORIES); if(C[cat]) return C[cat];
  return {e:'📦',c:colorFromText(cat||'Outros')}; }
// Cor estável a partir de um texto — a mesma palavra sempre gera a mesma cor.
function colorFromText(s){ let h=0; for(let i=0;i<s.length;i++) h=s.charCodeAt(i)+((h<<5)-h);
  const p=['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#eab308'];
  return p[Math.abs(h)%p.length]; }
const findWallet = id => state.wallets.find(w=>w.id===id);
/* Nome e emoji de onde o dinheiro saiu. A poupança não é carteira, mas
   precisa aparecer nas listas como se fosse. */
function moneySource(id){
  return id===SAVINGS_WALLET ? {id:SAVINGS_WALLET,name:'Poupança',emoji:'🐷'} : findWallet(id);
}
const formatDayMonth = iso => { const [y,m,d]=iso.split('-'); return `${d}/${m}`; };
const toMonthKey = iso => iso.slice(0,7);
const MONTH_NAMES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const currentMonth = () => new Date().toISOString().slice(0,7);
// Saudação conforme o horário do aparelho.
function greetingText(){ const h=new Date().getHours(); return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'; }

// Soma entradas, despesas e saldo de um mês.
function monthSummary(mk=currentMonth()){
  let inc=0,exp=0;
  state.transactions.forEach(x=>{ if(toMonthKey(x.date)!==mk) return;
    if(x.wallet===SAVINGS_WALLET) return;   // pago com a poupança: fora do mês
    const isVale=BENEFIT_WALLETS.includes(x.wallet);
    if(x.type==='receita'){ if(!isVale) inc+=x.amount; }
    else if(x.type==='despesa'){ if(!isVale) exp+=x.amount; }
  });
  return {inc,exp,bal:inc-exp};
}
/* soma tudo (todos os meses) para o Histórico Geral */
// Mesma conta do resumo mensal, só que somando todos os meses.
function overallSummary(){
  let inc=0,exp=0,foodIn=0,foodOut=0,trIn=0,trOut=0;
  state.transactions.forEach(x=>{
    if(x.wallet===SAVINGS_WALLET) return;   // pago com a poupança: não é despesa do salário
    const food=(x.wallet==='va'||x.wallet==='vr'), tr=(x.wallet==='vt');
    if(x.type==='receita'){ food?foodIn+=x.amount: tr?trIn+=x.amount: inc+=x.amount; }
    else if(x.type==='despesa'){ food?foodOut+=x.amount: tr?trOut+=x.amount: exp+=x.amount; }
  });
  /* O que foi enviado para a poupança saiu do saldo, então sai também
     daqui — senão esta tela mostraria um total diferente do Início. */
  return {inc,exp,bal:inc-exp-savingsSentFromBalance(),foodIn,foodOut,trIn,trOut};
}
/* Saldo acumulado, sem contar os benefícios.

   Observação:
   Vale-alimentação e vale-transporte não entram no saldo total de
   propósito. Esse dinheiro não é livre: só serve para aquilo. Somar
   tudo daria um saldo maior do que a pessoa realmente tem para gastar. */
function totalBalance(){ return state.wallets.reduce((s,w)=> BENEFIT_WALLETS.includes(w.id)?s:s+w.balance, 0); }
// Saldo atual do vale-alimentação.
function foodBenefitBalance(){ const va=findWallet('va'); return va?va.balance:0; }
// Saldo atual do vale-transporte.
function transportBenefitBalance(){ const vt=findWallet('vt'); return vt?vt.balance:0; }

/* ---------------------------------------------------------------
   POUPANÇA

   Observação:
   A poupança tem saldo e histórico próprios, fora da lista de
   transações. Guardar dinheiro não é receita nem despesa: se entrasse
   como despesa, o mês fecharia com um gasto que nunca existiu e o
   gráfico de categorias ficaria torto. Por isso ela é um contador
   separado, que só cresce quando a pessoa inclui e só diminui quando
   ela retira.
   --------------------------------------------------------------- */
// Quanto está guardado hoje.
function savingsBalance(){ return (state.savings && state.savings.balance) || 0; }

/* Quanto saiu do saldo e virou dinheiro guardado.

   Observação:
   Só os envios entram nesta conta. Valores incluídos à mão são dinheiro
   que já estava guardado em outro lugar e nunca passou pela conta, então
   não podem descontar de nada. */
function savingsSentFromBalance(){
  if(!state.savings || !state.savings.history) return 0;
  return state.savings.history.reduce((sum,m)=> m.kind==='transf'? sum+m.amount : sum, 0);
}

// Anota o movimento no histórico da poupança.
function pushSavingsMovement(kind,amount){
  state.savings.history.unshift({id:newId(),date:new Date().toISOString().slice(0,10),kind,amount});
}

/* Aviso rápido que aparece e some sozinho no rodapé. */
let toastTimer;
// Mostra um aviso rápido no rodapé.
function showToast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200); }

/* ---------------------------------------------------------------
   5. TELAS
   Cada tela monta o próprio HTML como texto e joga no seu container.

   Observação:
   Optei por montar o HTML como texto em vez de criar elemento por
   elemento. Com telas deste tamanho o ganho de desempenho de uma
   abordagem mais elaborada seria irrelevante, e assim a estrutura de
   cada tela fica visível de uma olhada só, o que facilita muito
   mexer nela depois.
   --------------------------------------------------------------- */

/* ============================================================
   Cabeçalho
   ============================================================ */

  } else if(scr==='mesdet'){

}

/* ============================================================
   Tela: Início

/* Cartões de carteira usados no Início e na tela de Carteiras. */
// Quanto entrou e saiu de uma carteira no mês.
function walletMonthFlow(id,mk=currentMonth()){
  let inc=0,exp=0,last=null;
  state.transactions.filter(x=>x.wallet===id||x.toWallet===id)
    .sort((a,b)=>b.date.localeCompare(a.date))
    .forEach(x=>{
      if(!last) last=x;
      if(toMonthKey(x.date)!==mk) return;
      if(x.wallet===id && (x.type==='despesa'||x.type==='transferencia'||x.type==='investimento')) exp+=x.amount;
      if((x.wallet===id&&x.type==='receita')||(x.toWallet===id)) inc+=x.amount;
    });
  return {inc,exp,last};
}
// Move o carrossel de carteiras para os lados.
function scrollWallets(dir){
  const sc=document.getElementById('homeWallets'); if(!sc) return;
  sc.scrollBy({left:dir*212,behavior:'smooth'});
  setTimeout(updateWalletArrows,350);
}
// Liga e desliga as setas do carrossel conforme a posição.
function updateWalletArrows(){
  const sc=document.getElementById('homeWallets'), L=document.getElementById('wnavL'), Rr=document.getElementById('wnavR');
  if(!sc||!L||!Rr) return;
  L.disabled = sc.scrollLeft<=2;
  Rr.disabled = sc.scrollLeft >= sc.scrollWidth - sc.clientWidth - 2;
}
// Monta os cartões de carteira.
function renderWalletCards(container,mode){
  container.className = mode==='scroll'?'wallets-scroll':'wgrid';
  container.innerHTML = state.wallets.map(w=>{
    const f=walletMonthFlow(w.id);
    const denom=f.inc+f.exp;
    const usedPct = denom>0?Math.round(f.exp/denom*100):0;
    const lastTx = f.last?`${formatDayMonth(f.last.date)} · ${f.last.desc}`:'Sem movimentações';
    return `<div class="wcard" onclick="openWallet('${w.id}')">
      <div class="band" style="background:${w.color}"></div>
      <div class="body">
        <div class="top">
          <div class="emoji" style="background:${hexToRgba(w.color,.14)}">${w.emoji}</div>
          <div style="min-width:0"><div class="nm">${w.name}</div><div class="ty">${w.type}</div></div>
        </div>
        <div class="bal num" style="color:${w.color}">${money(w.balance)}</div>
        <div class="flow">
          <span class="up">↑ <b class="num">${money(f.inc)}</b></span>
          <span class="dn">↓ <b class="num">${money(f.exp)}</b></span>
        </div>

/* Gráfico de rosca das despesas por categoria. */
/* Agrupa as despesas do mês por categoria.

   Observação:
   Gastos pagos com vale ficam de fora. O gráfico responde à pergunta
   "quanto do meu salário eu já gastei", e o vale não sai do salário.
   Se entrasse, a porcentagem passaria de 100% sem a pessoa ter
   estourado nada. */
function expensesByCategory(mk=currentMonth()){
  const map={};
  state.transactions.forEach(x=>{ if(x.type!=='despesa'||toMonthKey(x.date)!==mk) return;
    if(BENEFIT_WALLETS.includes(x.wallet)) return;  // pago com vale: não entra no gráfico
    if(x.wallet===SAVINGS_WALLET) return;          // pago com a poupança: também não entra
    map[x.cat]=(map[x.cat]||0)+x.amount; });
  return Object.entries(map).map(([cat,val])=>({cat,val,c:categoryInfo('despesa',cat).c}))
    .sort((a,b)=>b.val-a.val);
}
/* Desenha o gráfico de rosca das despesas.

   Observação:
   A porcentagem é calculada sobre o que entrou no mês, não sobre o
   total gasto. Por isso existe a fatia "Sobrou": sem ela as fatias
   nunca fechariam 100% e o gráfico ficaria com um buraco sem
   explicação. Quando não há entradas no mês, a base volta a ser o
   total de despesas — senão daria divisão por zero. */
function renderDonut(container){
  const data=expensesByCategory();
  const totalExp=data.reduce((s,d)=>s+d.val,0);
  if(totalExp===0){ container.innerHTML=`<div class="empty" style="padding:24px"><div class="e">📊</div><p>Nenhuma despesa paga com salário/extras neste mês.<br><span style="font-size:11.5px">Gastos pagos com vale não entram aqui.</span></p></div>`; return; }
  const income=monthSummary().inc;              // entradas do mês (salário + extras)
  const useInc=income>0;
  const overspent=useInc && totalExp>income;
  const base=useInc?income:totalExp;          // base do %
  const arcBase=(useInc && !overspent)?income:totalExp; // base dos arcos
  const leftover=useInc?Math.max(0,income-totalExp):0;
  const r=54,cx=64,cy=64,C=2*Math.PI*r,sw=22;
  let acc=0;
  let segs=data.map(d=>{
    const frac=d.val/arcBase, len=frac*C, dash=`${len} ${C-len}`, off=-acc*C; acc+=frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.c}" stroke-width="${sw}"
      stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})"
      stroke-linecap="butt"></circle>`;
  }).join('');
  if(leftover>0){
    const frac=leftover/arcBase, len=frac*C, dash=`${len} ${C-len}`, off=-acc*C;
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#cbd5e1" stroke-width="${sw}"
      stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"></circle>`;
  }
  let legend=data.slice(0,6).map(d=>`<div class="lg-row">
    <span class="lg-dot" style="background:${d.c}"></span>
    <span class="lg-nm">${d.cat}</span>
    <span class="lg-pc num">${Math.round(d.val/base*100)}%</span></div>`).join('');
  if(leftover>0){
    legend+=`<div class="lg-row"><span class="lg-dot" style="background:#cbd5e1"></span>
      <span class="lg-nm">Sobrou</span><span class="lg-pc num">${Math.round(leftover/base*100)}%</span></div>`;
  }
  const note = useInc
    ? `<div class="donut-note">% sobre as entradas do mês (${money(income)}) · só gastos pagos com salário/extras${overspent?' · ⚠️ gastou mais que entrou':''}</div>`
    : `<div class="donut-note">Sem entradas no mês — % sobre o total de gastos do salário/extras</div>`;
  container.innerHTML=`<div class="donut-wrap">
    <svg class="donut" width="128" height="128" viewBox="0 0 128 128">
      ${segs}
      <text class="donut-total num" x="64" y="60" text-anchor="middle">${moneyShort(totalExp)}</text>
      <text class="donut-center" x="64" y="76" text-anchor="middle">gasto</text>
    </svg>
    <div class="legend">${legend}</div></div>${note}`;
}

// Uma linha da lista de transações.
function transactionRow(x){
  const isIn = x.type==='receita';
  const isTr = x.type==='transferencia';
  const isInv= x.type==='investimento';
  const info = isTr?{e:'🔄',c:'#2563eb'} : isInv?{e:'📈',c:'#7c3aed'} : categoryInfo(x.type,x.cat);
  const w=moneySource(x.wallet);
  let sub;
  if(isTr){ const tw=findWallet(x.toWallet); sub=`${formatDayMonth(x.date)} · ${w?w.name:''} → ${tw?tw.name:''}`; }
  else if(x.wallet===SAVINGS_WALLET) sub=`${formatDayMonth(x.date)} · ${x.cat||''} · 🐷 Debitado da poupança`;
  else sub=`${formatDayMonth(x.date)} · ${x.cat||''} · ${w?w.name:''}`;
  const sign = isIn?'+':'-';
  const cls = isIn?'in':'out';
  return `<div class="tx-row">
    <div class="tx-ic" style="background:${hexToRgba(info.c,.14)}">${info.e}</div>
    <div class="tx-mid"><div class="d">${x.desc}</div><div class="m">${sub}</div></div>
    <div class="tx-amt ${cls} num">${sign}${money(x.amount).replace('R$ ','R$ ')}
      <small>${w?w.emoji+' '+w.name:''}</small></div>
    <button class="del-x" onclick="deleteTransaction('${x.id}',event)">🗑</button>
  </div>`;
}
// Troca o filtro da lista de transações.
function setTransactionFilter(f){ transactionFilter=f; renderTransactions(); }
// Apaga uma transação e devolve o valor para a carteira.
function deleteTransaction(id,ev){ ev.stopPropagation();
  if(!confirm('Excluir esta transação? O saldo da carteira será revertido.')) return;
  const x=state.transactions.find(t=>t.id===id); if(!x) return;
  undoWalletEffect(x);
  state.transactions=state.transactions.filter(t=>t.id!==id);
  saveState(); renderAll(); showToast('Transação excluída');
}
/* Desfaz o efeito de uma transação no saldo das carteiras.

   Observação:
   Ainda trato aqui os tipos "transferencia" e "investimento" mesmo
   não sendo mais possível criá-los pelo app. Quem usa desde as
   primeiras versões pode ter lançamentos assim salvos, e sem esse
   tratamento o saldo ficaria errado ao apagá-los. */
function undoWalletEffect(x){
  if(x.wallet===SAVINGS_WALLET){                       // despesa paga com a poupança
    if(x.type==='despesa') state.savings.balance+=x.amount;
    return;
  }
  const w=findWallet(x.wallet);
  if(x.type==='receita' && w) w.balance-=x.amount;
  if((x.type==='despesa'||x.type==='investimento') && w) w.balance+=x.amount;
  if(x.type==='transferencia'){ const tw=findWallet(x.toWallet);
    if(w) w.balance+=x.amount; if(tw) tw.balance-=x.amount; }
  if(x.type==='investimento'){ const iw=findWallet('inv'); if(iw) iw.balance-=x.amount; }
}

  const sub=`${formatDayMonth(x.date)} · ${x.cat||''}${w?' · '+w.name:''}`;
  return `<div class="tx-row">

    <div class="tx-mid"><div class="d">${x.desc}</div><div class="m">${sub}</div></div>

}

// Lista dos meses que já têm algum lançamento.
function monthsWithData(){ return [...new Set(state.transactions.map(x=>toMonthKey(x.date)))].sort().reverse(); }
// Converte 2026-07 em "Julho 2026".
function monthLabel(mk){ const [y,mo]=mk.split('-'); return `${MONTH_NAMES[+mo-1]} ${y}`; }
// Converte 2026-07 em "Jul/26", para caber nos gráficos.
function shortMonth(mk){ const [y,mo]=mk.split('-'); return MONTH_NAMES[+mo-1].slice(0,3)+'/'+y.slice(2); }
// Entradas, despesas e saldo de um mês específico.
function summaryForMonth(mk){
  let inc=0,exp=0,foodIn=0,foodOut=0,trIn=0,trOut=0;
  state.transactions.forEach(x=>{ if(toMonthKey(x.date)!==mk) return;
    if(x.wallet===SAVINGS_WALLET) return;   // pago com a poupança: fora do mês
    const food=(x.wallet==='va'), tr=(x.wallet==='vt');
    if(x.type==='receita'){ food?foodIn+=x.amount: tr?trIn+=x.amount: inc+=x.amount; }
    else if(x.type==='despesa'){ food?foodOut+=x.amount: tr?trOut+=x.amount: exp+=x.amount; }
  });
  return {inc,exp,bal:inc-exp,foodIn,foodOut,trIn,trOut};
}

// Monta os períodos usados na comparação.
function comparePeriods(mode){
  if(mode==='ano'){
    const years=[...new Set(state.transactions.map(x=>x.date.slice(0,4)))].sort();
    return years.map(y=>{ let inc=0,exp=0;
      state.transactions.forEach(x=>{ if(x.date.slice(0,4)!==y) return;
        if(x.wallet==='va'||x.wallet==='vt') return;
        if(x.type==='receita') inc+=x.amount; else if(x.type==='despesa') exp+=x.amount; });
      return {label:y,inc,exp,bal:inc-exp}; });
  }
  return monthsWithData().slice(0,6).reverse().map(mk=>{ const s=summaryForMonth(mk);
    return {label:shortMonth(mk),inc:s.inc,exp:s.exp,bal:s.bal}; });
}
// Gráfico de barras da comparação.
function comparisonBars(periods){
  const max=Math.max(1,...periods.map(p=>Math.max(p.inc,p.exp)));
  const n=periods.length, groupW=Math.max(66,Math.min(110,320/n)), W=n*groupW, H=200, base=H-26, top=14;
  let bars='';
  periods.forEach((p,i)=>{
    const cx=i*groupW+groupW/2;
    const hIn=(p.inc/max)*(base-top), hEx=(p.exp/max)*(base-top);
    bars+=`<rect x="${cx-19}" y="${base-hIn}" width="16" height="${hIn}" rx="3" fill="#16a34a"/>
      <rect x="${cx+3}" y="${base-hEx}" width="16" height="${hEx}" rx="3" fill="#ef4444"/>
      <text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${p.label}</text>`;
  });
  return `<div style="overflow-x:auto;padding-bottom:4px"><svg viewBox="0 0 ${W} ${H}" style="min-width:${W}px;height:${H}px;max-width:100%">${bars}</svg></div>
    <div class="cmp-legend"><span><i style="background:#16a34a"></i>Entradas</span><span><i style="background:#ef4444"></i>Despesas</span></div>`;
}
// Tela de comparação entre períodos.

  const el=document.getElementById('scr-comparar');
  const isAno=comparisonMode==='ano';
  const periods=comparePeriods(comparisonMode);
  const enough = periods.length>=1 && periods.some(p=>p.inc>0||p.exp>0);
  const totalInc=periods.reduce((s,p)=>s+p.inc,0), totalExp=periods.reduce((s,p)=>s+p.exp,0);
  const avg = periods.length? (totalInc-totalExp)/periods.length : 0;
  let best=null,worst=null; periods.forEach(p=>{ if(best===null||p.bal>best.bal) best=p; if(worst===null||p.bal<worst.bal) worst=p; });
  const body = enough ? `
    ${comparisonBars(periods)}
    <div class="card" style="margin-top:12px">
      <table class="proj-table">
        <thead><tr><th>${isAno?'Ano':'Mês'}</th><th>Entradas</th><th>Despesas</th><th>Saldo</th></tr></thead>
        <tbody>${periods.map(p=>`<tr><td>${p.label}</td>
          <td class="num" style="color:var(--green)">${money(p.inc)}</td>
          <td class="num" style="color:var(--red)">${money(p.exp)}</td>
          <td class="num"><b style="color:${p.bal>=0?'var(--green)':'var(--red)'}">${money(p.bal)}</b></td></tr>`).join('')}</tbody>
      </table>

// Devolve os últimos N meses, mesmo os que não têm lançamento.
function lastNMonths(n){
  const arr=[]; const now=new Date();
  for(let i=n-1;i>=0;i--){ const dt=new Date(now.getFullYear(),now.getMonth()-i,1);
    arr.push({key:dt.toISOString().slice(0,7),label:MONTH_NAMES[dt.getMonth()].slice(0,3)}); }
  return arr;
}

/* Gráfico de linha da evolução do saldo.

   Observação:
   Os gráficos são SVG montado à mão. Testei bibliotecas prontas, mas
   todas pesavam mais que o app inteiro e exigiam internet para
   carregar. Como os gráficos aqui são simples, sai mais leve assim —
   e o app continua funcionando offline. */
function lineChart(pts){
  if(pts.every(p=>p.val===0)) return `<div class="empty" style="padding:24px"><div class="e">📈</div><p>Ainda sem dados suficientes.</p></div>`;
  const W=400,H=160,pad=28;
  const vals=pts.map(p=>p.val); const min=Math.min(0,...vals), max=Math.max(1,...vals);
  const x=i=> pad + i*(W-2*pad)/(pts.length-1||1);
  const y=v=> H-pad - (v-min)/(max-min||1)*(H-2*pad);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.val).toFixed(1)}`).join(' ');
  const area=`${line} L${x(pts.length-1)},${H-pad} L${x(0)},${H-pad} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.val)}" r="3.5" fill="var(--green)"/>`).join('');
  const labels=pts.map((p,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${p.label}</text>`).join('');
  return `<svg class="line-svg" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--green)" stop-opacity=".28"/>
      <stop offset="1" stop-color="var(--green)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#lg)"/>
    <path d="${line}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${labels}</svg>`;
}

/* Valor futuro de um aporte inicial somado a aportes mensais.

   Observação:
   A taxa anual é convertida para mensal pela equivalência composta
   ((1+i)^(1/12)-1), e não dividindo por 12. Dividir por 12 é mais
   simples, mas dá um resultado otimista demais em prazos longos. */
function futureValue(P,A,i,n){ let fv=P*Math.pow(1+i,n); fv += i>0?A*((Math.pow(1+i,n)-1)/i):A*n; return fv; }
/* Alíquota do imposto de renda conforme o prazo da aplicação.

   Observação:
   É a tabela regressiva vigente. Deixei em função separada justamente
   porque essa tabela pode mudar por lei — assim é um lugar só para
   alterar, sem mexer no resto do cálculo. */
function incomeTaxRate(days){ return days<=180?0.225:days<=360?0.20:days<=720?0.175:0.15; }
function updateInvestmentResults(){
  const g=id=>parseAmount((document.getElementById(id)||{}).value||'0');
  const s=investmentInput;
  s.initial=g('iiInitial'); s.monthly=g('iiMonthly'); s.years=Math.max(0,g('iiYears'));
  s.cdi=Math.max(0,g('iiCdi')); s.cdbPct=Math.max(0,g('iiCdb')); s.lciPct=Math.max(0,g('iiLci'));
  const n=Math.round(s.years*12), days=n*30, invested=s.initial+s.monthly*n;
  const cdiA=s.cdi/100, mOf=a=>Math.pow(1+a,1/12)-1, ir=incomeTaxRate(days);
  const prods=[
    {name:'Poupança', m:0.005, taxed:false, note:'0,5%/mês · isento de IR', e:'🐷', c:'#0ea5e9'},
    {name:'Tesouro Selic', m:mOf(cdiA), taxed:true, note:'≈100% do CDI · IR regressivo', e:'🏛️', c:'#16a34a'},
    {name:`CDB ${formatNumber(s.cdbPct)}% CDI`, m:mOf(cdiA*s.cdbPct/100), taxed:true, note:`${formatNumber(s.cdbPct)}% do CDI · IR regressivo`, e:'🏦', c:'#2563eb'},
    {name:`LCI/LCA ${formatNumber(s.lciPct)}% CDI`, m:mOf(cdiA*s.lciPct/100), taxed:false, note:`${formatNumber(s.lciPct)}% do CDI · isento de IR`, e:'🌾', c:'#f59e0b'},
  ];
  const rows=prods.map(p=>{
    const fv=futureValue(s.initial,s.monthly,p.m,n), gross=fv-invested;
    const irPaid=p.taxed?Math.max(0,gross)*ir:0, net=fv-irPaid, netGain=net-invested;
    const pct=invested>0?netGain/invested*100:0;
    return {...p,net,netGain,irPaid,pct};
  }).sort((a,b)=>b.net-a.net);
  const el=document.getElementById('invResult'); if(!el) return;
  const presets=[1,5,10,20,30], yNow=Math.round(s.years);
  const presetRow=`<div class="prazo-row">${presets.map(y=>`<button class="prazo-chip${yNow===y?' on':''}" onclick="setTermInYears(${y})">${y} ${y===1?'ano':'anos'}</button>`).join('')}</div>`;
  el.innerHTML=`
    ${presetRow}
    <div class="inv-invested">Investindo <b>${formatMoney(invested)}</b> em ${formatNumber(s.years)} ${s.years==1?'ano':'anos'} (${n} meses)</div>
    ${rows.map((p,i)=>`
      <div class="inv-card${i===0?' win':''}">
        <div class="ic-ic" style="background:${hexToRgba(p.c,.14)};color:${p.c}">${p.e}</div>
        <div class="ic-main">
          <div class="ic-name">${p.name}${i===0?' <span class="win-tag">🏆 melhor</span>':''}</div>
          <div class="ic-note">${p.note}</div>
          <div class="ic-line">Valor final líquido: <b>${formatMoney(p.net)}</b></div>
          <div class="ic-sub">Rendeu <b style="color:var(--green)">${formatMoney(p.netGain)}</b> · IR ${formatMoney(p.irPaid)}</div>
        </div>
        <div class="ic-pct" style="color:${p.c}">+${formatPercent(p.pct)}%</div>
      </div>`).join('')}`;
  const lbl=document.getElementById('iiPrazoLbl'); if(lbl) lbl.textContent=`IR ${(ir*100).toFixed(1).replace('.',',')}%`;
}

  if(!res) return;
  if(!(cs.price>0)||!(cs.invest>0)){
    res.innerHTML=`<div class="empty" style="padding:20px"><div class="e">${c.sym}</div><p>Informe o preço de hoje e quanto quer investir.</p></div>`;
    if(scn) scn.innerHTML=''; return;
  }
  const coins=cs.invest/cs.price;
  let target='';
  if(cs.target>0){
    const fut=coins*cs.target, gain=fut-cs.invest, pct=gain/cs.invest*100, up=gain>=0;
    target=`<div class="cy-target">
      <div class="cyt-row"><span>No preço-alvo (${formatMoney(cs.target)})</span><b>${formatMoney(fut)}</b></div>
      <div class="cyt-res" style="color:${up?'var(--green)':'var(--red)'}">${up?'📈 Lucro':'📉 Prejuízo'}: ${up?'+':''}${formatMoney(gain)} (${up?'+':''}${formatPercent(pct)}%)</div>
    </div>`;
  }
  res.innerHTML=`
    <div class="cy-buy">
      <div class="cyb-ic" style="background:${hexToRgba(c.c,.16)};color:${c.c}">${c.sym}</div>
      <div style="min-width:0"><div class="cyb-k">Com ${formatMoney(cs.invest)} você compra</div>
        <div class="cyb-v">${formatCoinAmount(coins)} ${cs.coin}</div>
        <div class="cyb-s">ao preço de ${formatMoney(cs.price)} cada</div></div>
    </div>${target}`;
  if(scn){
    const list=[{l:'📉 Cair 50%',m:0.5},{l:'2x — dobrar',m:2},{l:'3x',m:3},{l:'5x',m:5},{l:'10x',m:10},{l:'🚀 100x',m:100}];
    scn.innerHTML=list.map(sc=>{ const val=coins*cs.price*sc.m, gain=val-cs.invest, up=gain>=0;
      return `<div class="scn-row">
        <div class="scn-l">${sc.l}<span class="scn-price">preço ${formatMoney(cs.price*sc.m)}</span></div>
        <div class="scn-r"><b>${formatMoney(val)}</b><span style="color:${up?'var(--green)':'var(--red)'}">${up?'+':''}${formatMoney(gain)}</span></div>
      </div>`; }).join('');
  }
}

/* Análises automáticas do mês.

   Observação:
   Preferi regras simples e fixas a qualquer coisa que dependesse de
   internet. O app precisa funcionar offline, e regras assim são
   fáceis de conferir e de ajustar depois. */
// Gera as análises do mês.
function renderInsights(){
  const box=document.getElementById('insights'); if(!box) return;
  const ms=monthSummary();
  const cats=expensesByCategory();
  const ins=[];
  // 1. saldo do mês
  if(ms.bal>=0 && ms.inc>0){
    ins.push({t:'ok',ic:'✅',html:`Você está no <b>azul</b> este mês: sobrou <b>${money(ms.bal)}</b>. Uma boa taxa de poupança é guardar pelo menos 10–20% da renda.`});
  } else if(ms.bal<0){
    ins.push({t:'bad',ic:'🚨',html:`Suas despesas superaram as entradas em <b>${money(-ms.bal)}</b> este mês. Vale revisar os maiores gastos abaixo.`});
  }
  // 2. maior categoria
  if(cats.length && ms.inc>0){
    const top=cats[0]; const share=Math.round(top.val/ms.inc*100);
    if(share>=40){
      ins.push({t:'warn',ic:'⚠️',html:`Você gastou <b>${share}%</b> da sua renda com <b>${top.cat}</b> (${money(top.val)}). Isso está acima do recomendado — tente reduzir cerca de <b>${money(top.val*0.25)}</b>.`});
    } else {
      ins.push({t:'ok',ic:'💡',html:`Seu maior gasto é <b>${top.cat}</b> (${money(top.val)}, ${share}% da renda). Está dentro de um patamar saudável.`});
    }
  }
  // 3. projeção de saldo
  const day=new Date().getDate();
  if(ms.exp>0 && day>0){
    const daily=ms.exp/day; const tb=totalBalance();
    if(daily>0){
      const daysLeft=Math.floor(tb/daily);
      if(daysLeft<20 && tb>0){
        ins.push({t:'bad',ic:'📉',html:`No ritmo atual de gastos (~${money(daily)}/dia), seu saldo total duraria cerca de <b>${daysLeft} dias</b>. Fique atento.`});
      } else {
        ins.push({t:'ok',ic:'📊',html:`Você gasta em média <b>${money(daily)}</b> por dia. No ritmo atual, seu saldo cobre os gastos por bastante tempo.`});
      }
    }
  }
  // 4. benefícios sobrando
  const va=findWallet('va'), vr=findWallet('vr');
  if(va && va.balance>500){
    ins.push({t:'ok',ic:'🍽️',html:`Você tem <b>${money(va.balance)}</b> no Vale Alimentação. Lembre-se de usá-lo antes de gastar do banco no mercado.`});
  }
  if(ins.length===0) ins.push({t:'ok',ic:'👋',html:`Adicione algumas transações e eu começo a analisar seus gastos e trazer sugestões por aqui.`});

  box.innerHTML=ins.map(i=>`<div class="insight">
    <div class="i-ic ins-${i.t}">${i.ic}</div><div class="i-tx">${i.html}</div></div>`).join('');
}
